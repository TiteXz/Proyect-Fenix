<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visor de animaciones de combate</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#12151c;color:#e8ecf4;font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{background:#232a38;border:1px solid #38425a;border-radius:8px;padding:8px 12px;min-height:40px;cursor:pointer}
button:hover{background:#2c3548}
button[aria-pressed=true]{background:#3b5fa8;border-color:#6d92e0}
:focus-visible{outline:2px solid #ffd27a;outline-offset:2px}
#app{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:100vh;height:100dvh}
#stage{position:relative;background:radial-gradient(120% 90% at 50% 20%,#4a5a7a 0%,#27304a 45%,#10131c 100%);min-height:0}
#cv{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;left:10px;top:8px;font-size:12px;opacity:.85;pointer-events:none;text-shadow:0 1px 2px #000}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;background:#12151cdd}
#panel{overflow-y:auto;padding:12px 16px 24px;border-left:1px solid #2a3142;background:#161a24}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#9fb0d0;margin:18px 0 8px}
h2:first-child{margin-top:0}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.row>.grow{flex:1;min-width:0}
input[type=range]{width:100%;accent-color:#6d92e0;min-height:28px}
input[type=search],select,textarea{width:100%;background:#0f121a;border:1px solid #38425a;border-radius:8px;padding:8px}
textarea{min-height:96px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
label{display:inline-flex;align-items:center;gap:6px}
#bar{position:relative;height:34px;border-radius:8px;overflow:hidden;display:flex;touch-action:none;cursor:pointer;margin:8px 0;border:1px solid #38425a}
#bar>i,#strip>i{display:block;height:100%}
.p1{background:#d98b2b}.p2{background:#d44b4b}.p3{background:#3f86c9}
#head{position:absolute;top:0;bottom:0;width:3px;margin-left:-1px;background:#fff;box-shadow:0 0 4px #000;pointer-events:none}
#strip{position:relative;height:30px;display:flex;border-radius:6px;margin:14px 0 10px;touch-action:none;opacity:.9}
.mk{position:absolute;top:-8px;bottom:-8px;width:22px;margin-left:-11px;cursor:ew-resize;touch-action:none;display:flex;justify-content:center}
.mk::after{content:"";width:4px;background:#fff;border-radius:2px;box-shadow:0 0 3px #000}
.mk:focus-visible{outline-offset:-2px}
.leg{display:flex;gap:12px;font-size:12px;color:#b8c4dc;flex-wrap:wrap}
.leg b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.ph{display:grid;grid-template-columns:96px 1fr 56px;gap:8px;align-items:center;margin:4px 0}
.ph output{text-align:right;font-variant-numeric:tabular-nums}
#clips{max-height:340px;overflow-y:auto;border:1px solid #2a3142;border-radius:8px;padding:4px}
#clips h3{margin:8px 6px 4px;font-size:12px;color:#ffd27a;text-transform:uppercase;letter-spacing:.05em}
#clips button{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:6px;padding:6px 8px;min-height:36px;font-size:13px;word-break:break-all}
#clips button[aria-pressed=true]{background:#3b5fa8}
#clips .v{float:right;margin-left:8px}
.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,Consolas,monospace}
.small{font-size:12px;color:#9fb0d0}
#ficha{border:1px solid #2a3142;border-radius:8px;padding:8px 10px;background:#12161f;font-size:13px;overflow-wrap:anywhere}
#ficha p{margin:4px 0}#ficha ul{margin:6px 0 0;padding-left:18px}#ficha li{margin:6px 0}
#ficha a{color:#8fb4ff}#ficha .tag{font-size:11px;color:#ffd27a;margin-left:4px}
#pfVals{margin:4px 0}
.ck{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0}
@media (max-width:820px){
  #app{display:block;height:auto}
  #stage{position:sticky;top:0;z-index:5;height:46vh;height:46dvh}
  #panel{border-left:0;overflow:visible;padding:12px 16px 40px}
  #clips{max-height:280px}
}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" aria-label="Vista 3D del personaje"></canvas>
    <div id="hud" class="mono"></div>
    <div id="msg">Cargando modelo…</div>
  </div>
  <div id="panel">
    <h2>Reproducción</h2>
    <div class="row">
      <button id="bPrev" aria-label="Fotograma anterior" title="Fotograma anterior (←)">⏮ −1f</button>
      <button id="bPlay" aria-label="Reproducir o pausar" title="Reproducir / pausar (Espacio)">⏸ Pausa</button>
      <button id="bNext" aria-label="Fotograma siguiente" title="Fotograma siguiente (→)">+1f ⏭</button>
      <label><input type="checkbox" id="cLoop" checked> Bucle</label>
    </div>
    <div id="bar" role="slider" tabindex="0" aria-label="Barra de tiempo" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0"><i class="p1"></i><i class="p2"></i><i class="p3"></i><div id="head"></div></div>
    <div class="row small mono"><span id="tTxt">0.00 / 0.00 s</span><span style="margin-left:auto" id="fTxt">f 0</span></div>
    <div class="ph"><span>Velocidad</span><input type="range" id="rSpeed" min="0.1" max="2" step="0.05" value="1" aria-label="Velocidad"><output id="oSpeed">1.0×</output></div>

    <h2>Cámara y ayudas</h2>
    <div class="row" id="views">
      <button data-v="front">Frente</button><button data-v="side">Lateral</button><button data-v="back">Espalda</button><button data-v="top">Cenital</button><button data-v="game">Vista de juego</button>
    </div>
    <div class="row">
      <label><input type="checkbox" id="cSkel"> Esqueleto</label>
      <label><input type="checkbox" id="cTrail"> Trayectoria mano der.</label>
    </div>
    <div class="row">
      <button id="bCmp" aria-pressed="false">Comparar</button>
      <select id="sB" aria-label="Clip B para comparar" class="grow" hidden></select>
    </div>

    <h2>Clips <span class="small" id="nClips"></span></h2>
    <div class="row">
      <input type="search" id="q" placeholder="Buscar clip…" aria-label="Buscar clip" class="grow">
    </div>
    <div class="row">
      <select id="fCfg" aria-label="Filtrar por configuración" class="grow"><option value="">Config: todas</option><option>EP</option><option>EE</option></select>
      <select id="fDir" aria-label="Filtrar por dirección" class="grow"><option value="">Dirección: todas</option></select>
    </div>
    <div id="clips" role="list"></div>

    <h2>Perfil de sensación</h2>
    <div class="row"><label class="grow">Perfil <select id="sPerfil" aria-label="Perfil de sensación"></select></label></div>
    <div class="row" id="rowPB" hidden><label class="grow">Perfil de B <select id="sPerfilB" aria-label="Perfil de sensación del clip B"></select></label><button id="bSame" title="Pone en B el mismo clip que A con otro perfil">Mismo clip en B</button></div>
    <div class="small" id="pfDesc"></div>
    <div class="small mono" id="pfVals"></div>
    <div class="ck">
      <label><input type="checkbox" id="cLunge"> Lunge</label>
      <label><input type="checkbox" id="cHit"> Hit-stop</label>
      <label><input type="checkbox" id="cShake"> Temblor</label>
      <label><input type="checkbox" id="cArma"> Mostrar arma</label>
    </div>
    <h2>Ficha de referencia</h2>
    <div id="ficha"></div>

    <h2>Ajuste de fases <span class="small" id="clipName"></span></h2>
    <div class="leg"><span><b class="p1"></b>Anticipación</span><span><b class="p2"></b>Activo</span><span><b class="p3"></b>Recuperación</span></div>
    <div class="small" style="margin-top:8px">Clip original: arrastra los dos marcadores para marcar los puntos de corte.</div>
    <div id="strip"><i class="p1"></i><i class="p2"></i><i class="p3"></i>
      <div class="mk" id="m1" role="slider" tabindex="0" aria-label="Corte anticipación a activo"></div>
      <div class="mk" id="m2" role="slider" tabindex="0" aria-label="Corte activo a recuperación"></div>
    </div>
    <div class="small mono" id="cutTxt"></div>
    <div class="ph"><span>Anticipación</span><input type="range" id="d0" min="0.02" max="2" step="0.01" aria-label="Duración anticipación"><output id="o0"></output></div>
    <div class="ph"><span>Activo</span><input type="range" id="d1" min="0.02" max="2" step="0.01" aria-label="Duración activo"><output id="o1"></output></div>
    <div class="ph"><span>Recuperación</span><input type="range" id="d2" min="0.02" max="2" step="0.01" aria-label="Duración recuperación"><output id="o2"></output></div>
    <div class="row small"><span id="refTxt" class="grow"></span><button id="bReset">Restablecer</button></div>

    <h2>Feedback</h2>
    <div class="row">
      <button id="vOk" aria-pressed="false">👍 Me gusta</button><button id="vNo" aria-pressed="false">👎 No</button>
      <button id="bCopy">Copiar valores</button>
    </div>
    <textarea id="out" readonly aria-label="Valores para pegar en el chat" placeholder="Aquí aparecen los valores a copiar"></textarea>
    <div class="small" id="copyMsg" role="status"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
'use strict';
const GLB_B64 = /*__GLB__*/'';
const GLB_NAME = /*__GLBNAME__*/'';
const PERFILES = /*__PERFILES__*/null;
const FPS = 30, FRAME = 1 / FPS, MIN_D = 0.02;
const $ = id => document.getElementById(id);

/* ---------- tabla de COMBATE.md §1.1 «Animaciones mínimas» (dur, fases) ---------- */
const T = (a, b, c) => [a, b, c];
const TABLA = {
  'ataque|izq|EP': T(.25, .10, .25), 'ataque|izq|EE': T(.30, .10, .30),
  'ataque|der|EP': T(.25, .10, .25), 'ataque|der|EE': T(.30, .10, .30),
  'ataque|arr|EP': T(.30, .10, .28), 'ataque|arr|EE': T(.35, .10, .35),
  'ataque|aba|EP': T(.26, .12, .26), 'ataque|aba|EE': T(.30, .12, .33),
  'parada|*|EP': T(.05, .10, .20), 'parada|*|EE': T(.05, .10, .25),
  'bloqueo|*|EP': T(.10, .10, .10), 'bloqueo|*|EE': T(.25 / 3, .25 / 3, .25 / 3),
  'defproy|*|EP': T(.04, .08, .18), 'defproy|*|EE': T(.25 / 3, .25 / 3, .25 / 3),
  'contraataque|*|EP': T(.12, .10, .38), 'contraataque|*|EE': T(.15, .10, .45),
  'habilidad|*|EP': T(.20, .15, .40), 'habilidad|*|EE': T(.25, .45, .40),
  'remate|*|EP': T(.25, .55, .50), 'remate|*|EE': T(.30, .60, .50),
};
const ACC_ALIAS = { ataque: 'ataque', ligero: 'ataque', ataqueligero: 'ataque', parada: 'parada', paradaperfecta: 'parada',
  bloqueo: 'bloqueo', defensa: 'defproy', desvio: 'defproy', defproy: 'defproy', defensaproyectil: 'defproy', bloqueoproyectil: 'defproy',
  contraataque: 'contraataque', contra: 'contraataque', habilidad: 'habilidad', estocada: 'habilidad', embestida: 'habilidad', remate: 'remate' };
const DIR_ALIAS = { izq: 'izq', izquierda: 'izq', der: 'der', derecha: 'der', arr: 'arr', arriba: 'arr', aba: 'aba', abajo: 'aba',
  fro: 'fro', frontal: 'fro', neutra: 'neu', neu: 'neu', n: 'neu' };

function parseName(name) {
  const toks = name.split('_');
  let cfg = '', dir = '', end = toks.length;
  toks.forEach((t, i) => {
    const u = t.toUpperCase();
    if ((u === 'EP' || u === 'EE') && !cfg) { cfg = u; end = Math.min(end, i); }
    else if (DIR_ALIAS[t.toLowerCase()] && i > 0 && !dir) { dir = DIR_ALIAS[t.toLowerCase()]; end = Math.min(end, i); }
  });
  const accion = toks.slice(0, Math.max(1, end)).join('_');
  return { accion, dir, cfg };
}
function tablaFases(name) {
  const p = parseName(name);
  const a = ACC_ALIAS[p.accion.toLowerCase().replace(/_/g, '')];
  if (!a || !p.cfg) return null;
  return TABLA[a + '|' + p.dir + '|' + p.cfg] || TABLA[a + '|*|' + p.cfg] || null;
}

/* ---------- perfiles de sensación (perfiles.json) ---------- */
const PF = PERFILES || { perfiles: {}, videos: {}, cancelacion_recuperacion_pct: {} };
const PF_KEYS = ['combate', 'original'].concat(Object.keys(PF.perfiles));
const PF_NAME = { combate: 'COMBATE.md (valores actuales)', original: 'Original (sin re-temporizar)' };
const EE_K = 1.17, LUNGE_MAX = 1.5;
function accionPerfil(name) {
  if (/^guardia_rota/.test(name) || /^tambaleo/.test(name)) return 'guardia_rota';
  const f = name.split('_')[0].toLowerCase(), p = parseName(name);
  if (f === 'ataque') return p.dir === 'arr' ? 'ligero_arriba' : p.dir === 'aba' ? 'ligero_abajo' : 'ligero_lateral';
  return { parada: 'parada_perfecta', bloqueo: 'bloqueo', contraataque: 'contraataque', estocada: 'habilidad', embestida: 'habilidad', remate: 'remate' }[f] || null;
}
/* fases, lunge (m) e hit-stop (ms) de un clip bajo un perfil; EE: anticipación y recuperación x1.17, activo x1.0 */
function perfilDe(clip, key) {
  const df = defaults(clip), none = { d: df.d.slice(), lunge: 0, hit: 0, ent: false, nota: '' };
  if (key === 'original') return { d: [df.c[0], df.c[1] - df.c[0], clip.duration - df.c[1]], lunge: 0, hit: 0, ent: false, nota: '' };
  const pr = PF.perfiles[key], acc = accionPerfil(clip.name), e = pr && acc && pr.acciones[acc];
  if (!e) return none;
  const ee = parseName(clip.name).cfg === 'EE', k = ee ? EE_K : 1;
  return { d: [Math.max(MIN_D, e.anticipacion * k), Math.max(MIN_D, e.activo), Math.max(MIN_D, e.recuperacion * k)], lunge: e.lunge_m || 0, hit: e.hitstop_ms || 0, ent: true, nota: e.notas || '', acc };
}
/* curva de lunge 0..1: sube suave en anticipación+activo, se mantiene y vuelve a origen al final de la recuperación (bucle continuo) */
const ss = u => { u = Math.min(Math.max(u, 0), 1); return u * u * (3 - 2 * u); };
function lungeCurve(lt, d) {
  const a = d[0] + d[1];
  if (lt <= a) return ss(lt / a);
  const r = (lt - a) / d[2];
  return r < 0.6 ? 1 : 1 - ss((r - 0.6) / 0.4);
}

/* ---------- time-warp por tramos (puro) ---------- */
function srcTime(t, c1, c2, dur, d) {
  const tot = d[0] + d[1] + d[2];
  if (t <= 0) return 0;
  if (t >= tot) return dur;
  if (t < d[0]) return c1 * t / d[0];
  t -= d[0];
  if (t < d[1]) return c1 + (c2 - c1) * t / d[1];
  t -= d[1];
  return c2 + (dur - c2) * t / d[2];
}

/* ---------- estado persistente ---------- */
const LS_KEY = 'fenix_visor_anim_v1';
let store = { clip: '', loop: true, skel: false, trail: false, fCfg: '', fDir: '', set: {}, perfil: 'combate', perfilB: 'fluido_agil', lunge: true, hit: true, shake: true, arma: true };
try { const s = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); if (s && typeof s === 'object') store = Object.assign(store, s); } catch (e) {}
if (!store.set || typeof store.set !== 'object') store.set = {};
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch (e) {} }

/* ---------- escena ---------- */
const cv = $('cv'), stage = $('stage');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setClearColor(0x000000, 0);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 60);
const controls = new THREE.OrbitControls(camera, cv);
controls.enableDamping = true; controls.dampingFactor = 0.12; controls.maxPolarAngle = Math.PI * 0.499; controls.minDistance = 0.8; controls.maxDistance = 14;
controls.addEventListener('change', () => { dirty = true; });
let dirty = true;

const touchDev = matchMedia('(pointer:coarse)').matches;
scene.add(new THREE.HemisphereLight(0xbfd0ff, 0x30343e, 0.55));
const key = new THREE.DirectionalLight(0xfff0dc, 2.4);
key.position.set(3, 5, 4); key.castShadow = true;
key.shadow.mapSize.set(touchDev ? 1024 : 2048, touchDev ? 1024 : 2048);
Object.assign(key.shadow.camera, { left: -3, right: 3, top: 3.5, bottom: -2.5, near: 1, far: 14 });
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.8); fill.position.set(-4, 2.5, 2); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffc9a0, 1.6); rim.position.set(-1, 3.5, -5); scene.add(rim);

(function floor() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 8, 64, 64, 64);
  gr.addColorStop(0, '#fff'); gr.addColorStop(0.6, '#bbb'); gr.addColorStop(1, '#000');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  const tex = new THREE.CanvasTexture(c);
  const m = new THREE.Mesh(new THREE.CircleGeometry(7, 48), new THREE.MeshStandardMaterial({ color: 0x2b3144, roughness: 0.95, metalness: 0, transparent: true, alphaMap: tex }));
  m.rotation.x = -Math.PI / 2; m.receiveShadow = true; scene.add(m);
  const grid = new THREE.GridHelper(10, 20, 0x8aa0cc, 0x8aa0cc);
  grid.material.transparent = true; grid.material.opacity = 0.14; grid.material.depthWrite = false; grid.position.y = 0.002; scene.add(grid);
})();

/* ---------- armas procedurales (solo para juzgar arcos; no son assets del juego) ---------- */
const matMetal = new THREE.MeshStandardMaterial({ color: 0xc9d2e0, metalness: 0.9, roughness: 0.3 });
const matDark = new THREE.MeshStandardMaterial({ color: 0x4a3326, roughness: 0.8, metalness: 0 });
const matGold = new THREE.MeshStandardMaterial({ color: 0xb8923a, metalness: 0.8, roughness: 0.4 });
const armaGeos = [];
function mk(geo, mat, x, y, z) { armaGeos.push(geo); const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; return m; }
function makeSword() {      // empuñadura en el origen, hoja a lo largo de +Y (eje del hueso de la mano)
  const g = new THREE.Group();
  g.add(mk(new THREE.CylinderGeometry(0.016, 0.016, 0.2, 8), matDark, 0, 0.0, 0));
  g.add(mk(new THREE.BoxGeometry(0.17, 0.025, 0.035), matGold, 0, 0.11, 0));
  g.add(mk(new THREE.BoxGeometry(0.04, 0.82, 0.01), matMetal, 0, 0.53, 0));
  const tip = mk(new THREE.ConeGeometry(0.02, 0.07, 4), matMetal, 0, 0.975, 0); tip.scale.set(1, 1, 0.25); tip.rotation.y = Math.PI / 4; g.add(tip);
  g.visible = false; return g;
}
function makeShield() {      // escudo circular pequeño (rodela) en el antebrazo/mano
  const g = new THREE.Group();
  const d = mk(new THREE.CylinderGeometry(0.27, 0.27, 0.03, 24), matGold, 0, 0, 0); d.rotation.z = Math.PI / 2;
  const b = mk(new THREE.SphereGeometry(0.06, 12, 8), matMetal, 0.03, 0, 0);
  g.add(d, b); g.visible = false; return g;
}
function syncArma(ch, clip) {
  if (!ch || !clip) return;
  const mir = /_\d+m$/.test(clip.name), ee = parseName(clip.name).cfg === 'EE';
  const hs = mir ? ch.handL : ch.hand, hsh = mir ? ch.hand : ch.handL;
  if (hs && ch.sword.parent !== hs) hs.add(ch.sword);
  if (hsh && ch.shield.parent !== hsh) { hsh.add(ch.shield); ch.shield.position.set(mir ? -0.04 : 0.04, 0.1, 0); }
  ch.sword.visible = !!store.arma && !!hs; ch.shield.visible = !!store.arma && ee && !!hsh; dirty = true;
}

/* ---------- personajes ---------- */
const loader = new THREE.GLTFLoader();
let glbBuf = null, clips = [], H = 1.8;
const chars = [];           // {root, mixer, action, clip, skel, hand}
function b64ToBuf(b) { const s = atob(b), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u.buffer; }
function parseGlb() { return new Promise((res, rej) => loader.parse(glbBuf.slice(0), '', res, rej)); }
function makeChar(gltf, x) {
  const root = gltf.scene; root.position.x = x;
  root.traverse(o => { if (o.isMesh || o.isSkinnedMesh) { o.castShadow = true; o.frustumCulled = false; } });
  scene.add(root);
  let hand = null, handL = null;
  root.traverse(o => {
    if (!o.isBone) return;
    if (!hand && /(^|[_.\-])hand[_.\-]?r(ight)?$|mano.*(der|_r)$|hand[_.]?r\b/i.test(o.name)) hand = o;
    if (!handL && /(^|[_.\-])hand[_.\-]?l(eft)?$|mano.*(izq|_l)$|hand[_.]?l\b/i.test(o.name)) handL = o;
  });

  RASGOS[main].forEach(l => add('p', l));
  if (A.cfg.prof.nota) add('p', 'Perfil ' + store.perfil + ': ' + A.cfg.prof.nota, 'small');
  add('p', 'Valores [EST] = estimaciones a partir de descripciones; no hay frame data publicado. Solo enlaces, no se incrusta nada de esos juegos.', 'small');
  const seen = new Set(), ul = document.createElement('ul');
  cats.concat(['mocap_y_animacion']).forEach(c => (PF.videos[c] || []).forEach(v => {
    if (seen.has(v.url) || !/^https:\/\//.test(v.url)) return; seen.add(v.url);
    const li = document.createElement('li'), a = document.createElement('a');
    a.href = v.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = v.titulo + ' (' + v.juego + ')';
    const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = '[' + (TIPO[v.tipo] || v.tipo) + ']';
    li.append(a, tag); ul.appendChild(li);
  }));
  box.appendChild(ul);
}
function refreshPerfil() {
  const k = store.perfil, pr = PF.perfiles[k], o = A.cfg;
  $('sPerfil').value = k;
  $('pfDesc').textContent = pr ? pr.descripcion + ' Inspiración: ' + pr.inspiracion + '.' : k === 'original' ? 'Sin re-temporizar: duraciones del clip original (tramos entre los cortes).' : 'Valores actuales de la tabla de COMBATE.md §1.1 (sin lunge ni hit-stop definidos).';
  const canc = PF.cancelacion_recuperacion_pct[k];
  $('pfVals').textContent = o.prof.ent ? `lunge ${num(o.prof.lunge)} m${o.prof.lunge > LUNGE_MAX ? ' (visor limita a ' + LUNGE_MAX + ' m)' : ''} · hit-stop ${num(o.prof.hit)} ms` + (canc ? ` · cancelar a ${canc} % de la recuperación` : '') : 'Este clip no tiene fila en el perfil: usa la tabla de COMBATE.md (sin lunge ni hit-stop).';
  buildFicha(false);
}

/* votos y copia */
function vote(v) { A.cfg.vote = A.cfg.vote === v ? '' : v; commit(A.clip, A.cfg); refreshUI(); }
$('vOk').onclick = () => vote('ok'); $('vNo').onclick = () => vote('no');
$('bCopy').onclick = async () => {
  buildBlock(); const ta = $('out'); let ok = false;
  try { await navigator.clipboard.writeText(ta.value); ok = true; } catch (e) {}
  ta.focus(); ta.select();
  if (!ok) { try { ok = document.execCommand('copy'); } catch (e) {} }
  $('copyMsg').textContent = ok ? 'Copiado al portapapeles.' : 'No se pudo copiar: el texto está seleccionado, cópialo a mano.';
};

/* atajos */
addEventListener('keydown', e => {
  const tg = e.target && e.target.tagName; if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT' || e.target.getAttribute('role') === 'slider') return;
  if (e.key === ' ' && tg !== 'BUTTON') { setPlay(!playing); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') stepFrames(-1); else if (e.key === 'ArrowRight') stepFrames(1);
});

/* ---------- bucle ---------- */
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.fov = w / h < 0.9 ? 52 : 38; camera.updateProjectionMatrix(); dirty = true;
}
new ResizeObserver(resize).observe(stage);
let last = performance.now(), fpsAcc = 0, fpsN = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  if (A && playing) {
    advance(dt); updateTime();
  }
  controls.update();
  if (dirty) { renderer.render(scene, camera); dirty = false; }
  fpsAcc += dt; fpsN++; if (fpsAcc > 1) { $('hud').textContent = Math.round(fpsN / fpsAcc) + ' fps'; fpsAcc = fpsN = 0; }
}

/* ---------- arranque ---------- */
(async function init() {
  try {
    if (!GLB_B64) throw new Error('visor sin GLB incrustado');
    glbBuf = b64ToBuf(GLB_B64);
    const g = await parseGlb(); clips = g.animations.slice();
    if (!clips.length) throw new Error('el GLB no tiene clips');
    const ch = makeChar(g, 0); chars.push(ch);
    const bb = new THREE.Box3().setFromObject(ch.root); H = Math.max(bb.max.y - bb.min.y, 0.5);
    $('sB').innerHTML = ''; clips.slice().sort((a, b) => a.name.localeCompare(b.name)).forEach(c => $('sB').add(new Option(c.name, c.name)));
    buildList(); resize(); setView('game');
    selectA(clips.find(c => c.name === store.clip) || clips.slice().sort((a, b) => a.name.localeCompare(b.name))[0]);
    $('msg').remove();
    const q = new URLSearchParams(location.search); if (q.get('test') === '1') setPlay(false);
    requestAnimationFrame(loop);
  } catch (e) { $('msg').textContent = 'Error: ' + e.message; console.error(e); }
})();

window.__VISOR__ = {
  srcTime,
  state: () => ({ glb: GLB_NAME, clips: clips.length, clip: A && A.clip.name, clipB: compare && B ? B.clip.name : null, playing, loop: loopOn(), compare, t: tShown(),
    dur: A && A.clip.duration, total: total(A), perfil: store.perfil, perfilB: dcmp() ? store.perfilB : null, prof: A && { lunge: A.cfg.prof.lunge, hit: A.cfg.prof.hit, ent: A.cfg.prof.ent }, totalB: dcmp() ? total(B) : null, dB: dcmp() ? B.cfg.d.slice() : null, lt: A && A.lt, ltB: dcmp() ? B.lt : null, hold: !!(A && (A.hsAct || (dcmp() && B.hsAct))), lungeZ: chars[0] ? chars[0].root.position.z : 0, swordVisible: !!(chars[0] && chars[0].sword.visible && chars[0].sword.parent), shieldVisible: !!(chars[0] && chars[0].shield.visible && chars[0].shield.parent), span: span(), cuts: A && A.cfg.c.slice(), d: A && A.cfg.d.slice(), speed: A && A.cfg.sp, vote: A && A.cfg.vote,
    srcAtEnd: A && srcTime(total(A), A.cfg.c[0], A.cfg.c[1], A.clip.duration, A.cfg.d), handBone: !!(chars[0] && chars[0].hand), tabla: A && A.cfg.tabla }),
  step: n => stepFrames(n), advance, lungeCurve, perfilDe: (n, k) => perfilDe(clips.find(c => c.name === n), k),
  seek: v => { setPlay(false); resetHS(); t = Math.min(Math.max(v, 0), span()); applyPose(); updateTime(); },
  pose: i => { const ch = chars[i || 0]; return ch ? ch.action.time : 0; },
};
</script>
