<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Visor del grimorio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Visor a pantalla completa: lienzo 3D detrás y un panel de mando flotante. Tema oscuro único (es un visor de escena). */
:root{
  --bg:#0c0e12; --panel:rgba(18,17,15,.84); --line:#4a3f2c; --fg:#f1e7d0; --muted:#b9ab8c; --accent:#e2b469; --accent-ink:#1d1408; --chip:#2a2419;
  --f-display:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --f-body:"EB Garamond", Georgia, "Times New Roman", serif;
  --f-ui:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 var(--f-ui);overflow:hidden;-webkit-text-size-adjust:100%}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button,select,input{font:inherit;color:inherit}
button,select{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:7px 11px;min-height:38px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button[aria-pressed=true]{background:#4a3a1e;border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#panel{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100% - 32px));
  background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:10px;z-index:5}
#panel h1{margin:0;font:600 22px/1.1 var(--f-display);letter-spacing:.02em}
#panel .sub{margin:2px 0 0;color:var(--muted);font:italic 15px/1.3 var(--f-body)}
.head{display:flex;align-items:flex-start;gap:10px}
.head>div{flex:1;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row>.grow{flex:1;min-width:0}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent);min-height:26px;margin:0}
.time{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);white-space:nowrap}
#secs button{flex:1 1 auto;padding:6px 8px;font:500 15px/1 var(--f-body)}
#secs button[aria-current=true]{border-color:var(--accent);background:#3a2e18}
#body{display:grid;gap:10px}
#panel,#body,#body>*,.head>div{min-width:0}
select{max-width:100%;text-overflow:ellipsis}
#panel.min #body{display:none}
#tip{position:fixed;pointer-events:none;z-index:6;background:rgba(20,16,10,.9);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font:500 15px var(--f-body);transform:translate(-50%,-140%)}
#live{position:fixed;left:-9999px}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:italic 18px var(--f-body);color:var(--muted);background:var(--bg);z-index:8}
.keys{font-size:11.5px;color:var(--muted)}
@media (max-width:560px){
  #panel{padding:10px 12px;gap:8px}
  #panel h1{font-size:19px}
  .keys{display:none}
}
</style>
</head>
<body>
<canvas id="cv" aria-label="Vista en primera persona: el protagonista saca y abre el grimorio"></canvas>
<div id="panel">
  <div class="head">
    <div>
      <h1>Grimorio</h1>
      <p class="sub">Abrir el menú y grabar una hoja nueva</p>
    </div>
    <button id="bMin" aria-expanded="true" aria-controls="body" title="Ocultar o mostrar los controles">Ocultar</button>
  </div>
  <div id="body">
    <div class="row">
      <button id="bOpen" class="primary">Abrir grimorio</button>
      <button id="bNew">Nuevo hechizo</button>
      <button id="bClose">Cerrar</button>
    </div>
    <div class="row">
      <label class="lbl" for="sSpell">Hechizo</label>
      <select id="sSpell" class="grow" aria-label="Hechizo que se graba">
        <option value="asharvel">Asharvel · saeta de ceniza tronante</option>
        <option value="bronystor">Bronystor · muralla de piedra helada y silbante</option>
        <option value="veshismar">Veshismar · estallido de penumbra ardiente y helada</option>
      </select>
    </div>
    <div class="row">
      <button id="bPlay" aria-label="Reproducir o pausar" style="min-width:44px">❚❚</button>
      <input type="range" id="rT" class="grow" min="0" max="1" step="0.001" value="0" aria-label="Momento de la animación">
      <span class="time" id="tTxt">0,00 / 0,00 s</span>
    </div>
    <div class="row">
      <label class="lbl" for="rSpeed" style="min-width:70px">Velocidad</label>
      <input type="range" id="rSpeed" class="grow" min="0.1" max="1.5" step="0.05" value="1">
      <span class="time" id="oSpeed">1,00×</span>
    </div>
    <div>
      <div class="lbl" style="margin-bottom:4px">Marcapáginas</div>
      <div class="row" id="secs"></div>
    </div>
    <div class="row">
      <button id="bCam" aria-pressed="false">Cámara libre</button>
      <span class="keys">Teclas: O abrir · N nuevo · 1–5 apartados · Espacio pausa · Esc cerrar</span>
    </div>
  </div>
</div>
<div id="tip" hidden></div>
<div id="live" aria-live="polite"></div>
<div id="msg">Preparando el grimorio…</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
'use strict';
/* Visor del grimorio (maqueta, no es el juego). Dos animaciones:
   A) abrir el menú: en primera persona el protagonista saca el libro del costado, lo abre y lo sostiene;

      y la tinta escribe el círculo de runas, el nombre y el sello (GUIA_UI §3, glifos de GUIA_VISUAL).
   Todo es función pura del tiempo de la línea temporal: se puede pausar, arrastrar y cambiar la velocidad. */

const W = 0.205, H = 0.285, T = 0.046, C = 0.0065, OV = 0.006;          // libro (m): hoja, bloque de páginas, tapa, vuelo de la tapa
const PW = 640, PH = 890;                                                // lienzo de cada página (px)
const ELEM = {
  101: { n: 'Fuego', ink: '#b4430d', em: '#ff7a2a', est: 'Ardiente · Ardiendo' },
  102: { n: 'Hielo', ink: '#1f6f96', em: '#8fdcff', est: 'Frío · Escarcha' },

for (const k in ELEM) RUNA[k] = ELEM[k].n;
// Recetas de COMBATE §2.6 (ejemplos 1–3) y tres hechizos ya conocidos para el índice.
const SPELLS = {
  asharvel: { name: 'Asharvel', sub: 'saeta de ceniza tronante', el: 101, runes: [201, 101, 101, 104, 'mult'], mana: 51, comp: 9, inest: 25, seed: 0x1a2b },
  bronystor: { name: 'Bronystor', sub: 'muralla de piedra helada y silbante', el: 105, runes: [204, 102, 105, 107], mana: 44, comp: 8, inest: 15, seed: 0x2b3c },
  veshismar: { name: 'Veshismar', sub: 'estallido de penumbra ardiente y helada', el: 106, runes: [203, 106, 106, 101, 102, 'ancla'], mana: 50, comp: 11, inest: 40, seed: 0x3c4d },
  ilenor: { name: 'Ilenor', sub: 'destello sagrado', el: 103, runes: [201, 103], mana: 18, comp: 3, inest: 0, seed: 0x4d5e, slot: 1 },
  yskavel: { name: 'Yskavel', sub: 'cono de cellisca', el: 102, runes: [202, 102, 102], mana: 28, comp: 5, inest: 15, seed: 0x5e6f, slot: 2 },
  silavar: { name: 'Silavar', sub: 'ráfaga cortante', el: 107, runes: [201, 107], mana: 18, comp: 3, inest: 0, seed: 0x6f70, slot: 3 },

const SPREADS = { hechizos: ['hechizos_izq', 'hechizos_der'], bolso: ['bolso_izq', 'bolso_der'], codice: ['codice_izq', 'codice_der'], mapa: ['mapa_izq', 'mapa_der'], ajustes: ['ajustes_izq', 'ajustes_der'], nuevo: ['nuevo_izq', 'nuevo_der'] };

/* ------------------------------------------------------------------ glifos (GUIA_VISUAL, «Glifos rúnicos») */
const L = (...p) => ({ t: 'l', p }), CI = (x, y, r) => ({ t: 'c', x, y, r }), Q = (a, b, c) => ({ t: 'q', p: [a, b, c] }), DT = (x, y) => ({ t: 'd', x, y });

const GLY = {

  102: { f: [L(...STEM), L([-1, 1], [1, 1]), L([0, 2], [-0.8, 2.85]), L([0, 2], [0.8, 2.85])], free: [[-0.75, 0.25], [0.75, 0.25], [0.7, 1.75]] },
  103: { f: [L([0, 0.75], [0, 3]), CI(0, 0.38, 0.36), L([-0.75, 1.45], [-0.3, 1.45]), L([0.3, 1.45], [0.75, 1.45])], free: [[0.8, 2.4], [-0.8, 2.4], [0.75, 0.2]] },
  104: { noStem: 1, f: [L([0, 0], [0.8, 1], [-0.8, 2], [0, 3])], free: [[-0.85, 0.45], [0.85, 2.5], [0.8, 2.0]] },
  105: { f: [L(...STEM), L([-1, 2.35], [-1, 3], [1, 3], [1, 2.35])], free: [[-0.8, 0.7], [0.8, 0.7], [0.75, 1.6]] },
  106: { f: [L([0, 0], [0, 2.35], [-0.7, 3]), L([0, 0.8], [0.9, 0.8], [0.9, 1.85])], free: [[-0.85, 1.1], [0.8, 2.75], [-0.8, 0.3]] },
  107: { f: [L(...STEM), Q([0, 0.9], [1.05, 0.55], [0.85, 1.5]), Q([0, 1.95], [1.05, 1.6], [0.85, 2.55])], free: [[-0.8, 1.2], [-0.8, 2.4], [-0.75, 0.3]] },
  201: { f: [L(...CAP), L(...STEM), L([-0.9, 2], [0, 1], [0.9, 2])], free: [...FR, [0.8, 2.7]] },
  202: { f: [L(...CAP), L([0, 0], [0, 1.2]), L([-0.9, 3], [0, 1.2], [0.9, 3])], free: [...FR, [0, 2.6]] },
  203: { f: [L(...CAP), L(...STEM), CI(0, 2, 0.72)], free: [...FR, [-0.9, 3]] },
  204: { f: [L(...CAP), L(...STEM), L([-1, 1.2], [1, 1.2]), L([-1, 2.2], [1, 2.2])], free: [[-0.75, 0.6], [0.75, 0.6], [0.75, 2.8]] },
  205: { f: [L(...CAP), L(...STEM), L([-0.9, 2.15], [-0.9, 3], [0.9, 3], [0.9, 2.15])], free: [...FR, [0.75, 1.5]] },
  206: { f: [L(...CAP), L(...STEM), L([0, 1.1], [0.5, 1.65], [0, 2.2], [-0.5, 1.65], [0, 1.1])], free: [...FR, [0.8, 2.7]] },
  // Modificador y Control: solo la marca de clase + BODY (su rasgo propio está pendiente en GUIA_VISUAL).
  mult: { f: [L([0, 0], [0, 2.7]), DT(0, 3.2), L(...BODY)], free: [] },
  ancla: { f: [L([-0.14, 0], [-0.14, 3]), L([0.14, 0], [0.14, 3]), L(...BODY)], free: [] },

// Geometría del glifo en unidades de rejilla (y hacia abajo); consumo del RNG según la guía.
const GCACHE = new Map();

/* Operaciones de trazo en px: {pts, lw, col:'el'|'fm', len} o {dot:[x,y], r, col, len}. El orden es el orden de escritura. */

  });

}

/* ------------------------------------------------------------------ dibujo de páginas (lienzos 2D) */
const DISPLAY = '"Cormorant Garamond", Georgia, serif', BODYF = '"EB Garamond", Georgia, serif';
const INK = '#2a1b10', INK2 = '#5c4630', GOLD = '#ffcf85';
function noiseLayer(w, h, cell, R) {

      for (let k = 0; k < 3; k++) { const p = seg(t, 1.5 + 0.08 * k, 2.45 + 0.16 * k); if (p > 0 && p < 1) S.sheets.push({ theta: Math.min(PI * eio(p), maxTheta), curl: 0.9, front: 'hechizos_der', back: 'hechizos_izq', lift: 0.0006 * (k + 1) }); }

      S.leftHand = eout(seg(t, 2.3, 3.0)); S.menuGlow = seg(t, 2.6, 3.6); S.open = t > 1.45; S.spread = 'hechizos';
    },
  }),
  cerrar: (from) => ({
    name: 'cerrar', dur: 2.8, spread: null, open: false,
    eval(t, S) { TL.abrir().eval(4.0 - t * (4.0 / 2.8), S); const sp = SPREADS[from || 'hechizos']; S.left = sp[0]; S.right = sp[1]; for (const s of S.sheets) { s.front = sp[1]; s.back = sp[0]; } S.spread = from; },
  }),
  nuevo: (key) => ({
    name: 'nuevo', dur: 4.0 + WT.end + 0.6, spread: 'nuevo', open: true,
    eval(t, S) {

      S.cover = 0; S.blur = 1; S.dim = lerp(0.5, 0.36, smooth(seg(t, 0, 0.8))); S.pitch = -0.2; S.leftHand = 1; S.menuGlow = 1; S.open = true; S.spread = 'hechizos';
      S.partT = t; S.reveal = seg(t, 0.75, 2.85) * 1.12; S.slide = eio(seg(t, 2.8, 3.3)); S.newOn = t > 0.7 && t < 3.45;
      S.edge = smooth(seg(t, 0.2, 1.2)) * (1 - seg(t, 3.0, 3.6));

        if (p >= 1) S.left = backs[k];

  }),

      name: 'pasar', dur: 0.85, spread: to, open: true,
      eval(t, S) {

        const p = eio(seg(t, 0, 0.85));

        else { S.left = B[0]; S.right = p >= 1 ? B[1] : A[1]; if (p < 1) S.sheets.push({ theta: PI * (1 - p), curl: -0.75, front: B[1], back: A[0], lift: 0.0008 }); }

};
const play = { tl: TL.abrir(), t: 0, playing: false, speed: 1, queue: [] };
function start(tl, autoplay) { play.tl = tl; play.t = 0; play.playing = autoplay !== false; if (tl.name === 'nuevo') { CUR_SPELL = tl.key || CUR_SPELL; } syncUI(); }

/* ------------------------------------------------------------------ aplicar estado */
const S0 = blankState();
let bob = 0, lastAnnounce = '';

/* ------------------------------------------------------------------ fondo, render y postproceso */
function buildRenderer() {
  renderer = new THREE.WebGLRenderer({ canvas: $('cv'), antialias: false, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  scene = new THREE.Scene();
  rig = new THREE.Group(); rig.position.set(0, 1.62, 0); scene.add(rig);
  fp = new THREE.PerspectiveCamera(52, 1, 0.02, 60); rig.add(fp);
  hold = new THREE.Group(); rig.add(hold);
  orbitCam = new THREE.PerspectiveCamera(40, 1, 0.01, 60);
  // fondo: captura de la Aldea del Vado; desenfoque por mip + 12 muestras; se invierte el ACES para que el etalonaje la deje como estaba

    uniforms: { tBg: { value: bgTex }, uBlur: { value: 0 }, uDim: { value: 1 }, uOff: { value: new THREE.Vector2() }, uAspect: { value: 1 }, uImgAspect: { value: 16 / 9 }, uExpo: { value: 1.1 } },

  // luz de tarde y relleno de cielo

  sun = new THREE.DirectionalLight(0xffe0b0, 0.95); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  const sc = sun.shadow.camera; sc.left = -0.4; sc.right = 0.4; sc.top = 0.4; sc.bottom = -0.4; sc.near = 0.2; sc.far = 4; sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.0015; sun.shadow.radius = 3;
  scene.add(sun, sun.target);

  const pm = new THREE.PMREMGenerator(renderer); const eq = bgTex.clone(); eq.mapping = THREE.EquirectangularReflectionMapping; eq.encoding = THREE.sRGBEncoding; eq.needsUpdate = true;

    fragmentShader: `uniform sampler2D tDiffuse; uniform float time, exposure, vig; varying vec2 vUv;
      vec3 aces(vec3 x){ const float a=2.51, b=0.03, c=2.43, d=0.59, e=0.14; return clamp((x*(a*x+b))/(x*(c*x+d)+e), 0.0, 1.0); }

function resize() {

/* ------------------------------------------------------------------ interacción */
let hovered = null, freeCam = false;

function goSection(i) {
  const to = SECTIONS[i].id, from = curSpread();
  if (from) { if (from !== to) start(TL.turn(from, to)); return; }
  if (!(play.tl.name === 'abrir' && play.playing)) start(TL.abrir());
  play.queue = [() => TL.turnTo(i)];
}
TL.turnTo = i => { const from = curSpread() || 'hechizos', to = SECTIONS[i].id; return from === to ? null : TL.turn(from, to); };

function newSpell() {
  CUR_SPELL = $('sSpell').value; const P = PAGES.nuevo_izq; if (P) P.drawn = false; fillSparks(CUR_SPELL);
  const tl = TL.nuevo(CUR_SPELL); tl.key = CUR_SPELL;
  if (!curSpread()) { start(TL.abrir()); play.queue = [() => tl]; } else start(tl);
}
function syncUI() {
  const open = !!curSpread();
  $('bClose').disabled = !open && !(play.tl.open && play.playing);
  const cur = curSpread();
  [...$('secs').children].forEach((b, i) => { b.setAttribute('aria-current', cur === SECTIONS[i].id ? 'true' : 'false'); });
  $('bPlay').textContent = play.playing ? '❚❚' : '▶';
}
function fmt(x) { return x.toFixed(2).replace('.', ','); }
function onPointer(e, click) {

  ray.setFromCamera(ndc, fp); const hit = curSpread() ? ray.intersectObjects(ribbons, false)[0] : null;
  hovered = hit ? hit.object : null; const tip = $('tip');
  if (hovered) { tip.hidden = false; tip.textContent = SECTIONS[hovered.userData.sec].n; tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px'; renderer.domElement.style.cursor = 'pointer'; }
  else { tip.hidden = true; renderer.domElement.style.cursor = ''; }

}
function setFree(v) {

  if (v) { const c = new THREE.Vector3(W * 0.0, 0, 0); book.localToWorld(c); fp.getWorldPosition(orbitCam.position); controls.target.copy(c); controls.update(); }
}
function wire() {
  SECTIONS.forEach((s, i) => { const b = document.createElement('button'); b.textContent = s.n; b.addEventListener('click', () => goSection(i)); $('secs').appendChild(b); });
  $('bOpen').onclick = openBook; $('bClose').onclick = closeBook; $('bNew').onclick = newSpell;
  $('bPlay').onclick = () => { if (!play.playing && play.t >= play.tl.dur) play.t = 0; play.playing = !play.playing; syncUI(); };
  $('rT').addEventListener('input', e => { play.playing = false; play.t = +e.target.value * play.tl.dur; syncUI(); });
  $('rSpeed').addEventListener('input', e => { play.speed = +e.target.value; $('oSpeed').textContent = fmt(play.speed) + '×'; });
  $('bCam').onclick = () => setFree(!freeCam);
  $('bMin').onclick = () => { const m = $('panel').classList.toggle('min'); $('bMin').textContent = m ? 'Controles' : 'Ocultar'; $('bMin').setAttribute('aria-expanded', String(!m)); };
  const cv = renderer.domElement;
  cv.addEventListener('pointermove', e => onPointer(e, false)); cv.addEventListener('click', e => onPointer(e, true));
  addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

    else if (e.key === 'o' || e.key === 'O') openBook(); else if (e.key === 'n' || e.key === 'N') newSpell(); else if (e.key === 'Escape') closeBook();

}

/* ------------------------------------------------------------------ bucle */
let last = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const time = now / 1000, dt = Math.min(0.1, last ? time - last : 0); last = time;
  if (play.playing) { play.t += dt * play.speed; if (play.t >= play.tl.dur) { play.t = play.tl.dur; play.playing = false; const nx = play.queue.shift(); if (nx) { const tl = nx(); if (tl) start(tl); } syncUI(); } }

}
function step(time) {

  $('rT').value = play.tl.dur ? play.t / play.tl.dur : 0; $('tTxt').textContent = `${fmt(play.t)} / ${fmt(play.tl.dur)} s`;
  // sol relativo al libro
  book.getWorldPosition(tmpV); sun.target.position.copy(tmpV); sun.position.copy(tmpV).add(tmpV2.set(-0.9, 1.4, 0.55)); sun.target.updateMatrixWorld();

}
async function init() {
  try {
    if (!window.THREE || !THREE.EffectComposer) throw new Error('No se pudo cargar three.js (hace falta conexión para la CDN).');
    await Promise.race([Promise.all(['600 40px "Cormorant Garamond"', 'italic 500 40px "Cormorant Garamond"', '400 20px "EB Garamond"', 'italic 400 20px "EB Garamond"', '500 20px "EB Garamond"'].map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 3500))]);
    const img = new Image(); img.src = FONDO || 'data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw=='; await img.decode().catch(() => {});
    bgTex = new THREE.Texture(img); bgTex.needsUpdate = true; bgTex.generateMipmaps = true; bgTex.minFilter = THREE.LinearMipmapLinearFilter;
    PARCH = [makeParchment(3, PW, PH), makeParchment(4, PW, PH)];
    DRAW.blanca = P => { base(P, 'r'); P.gg.fillStyle = '#000'; P.gg.fillRect(0, 0, PW, PH); };
    buildRenderer(); buildBook(); buildParticles(); fillSparks(CUR_SPELL); wire(); resize();
    for (const id of ['hechizos_izq', 'hechizos_der', 'blanca']) page(id);
    const q = new URLSearchParams(location.search);
    window.__GRIMORIO__ = {
      play: (n, key) => { if (key) $('sSpell').value = key; if (n === 'abrir') start(TL.abrir()); else if (n === 'nuevo') { CUR_SPELL = $('sSpell').value; if (PAGES.nuevo_izq) PAGES.nuevo_izq.drawn = false; fillSparks(CUR_SPELL); const tl = TL.nuevo(CUR_SPELL); tl.key = CUR_SPELL; start(tl); } else if (n === 'cerrar') start(TL.cerrar('hechizos')); },
      turn: (from, to) => start(TL.turn(from, to)),
      setT: t => { play.playing = false; play.t = t; step(performance.now() / 1000); },
      state: () => ({ tl: play.tl.name, t: play.t, dur: play.tl.dur, playing: play.playing, spread: curSpread(), calls: renderer.info.render.calls }),
      setFree, ready: true,
    };
    if (innerWidth < 560) $('bMin').click();
    $('msg').hidden = true;
    if (q.get('test') === '1') { play.playing = false; step(0); }
    else { start(TL.abrir()); requestAnimationFrame(frame); }
  } catch (e) { $('msg').hidden = false; $('msg').textContent = e.message; console.error(e); }
}
init();
