    <path d="M300 614 C318 650 340 690 356 718" stroke="#2a1a10" stroke-width="6"/>
    <circle cx="352" cy="712" r="5" fill="url(#acero)"/>
    <!-- gavilanes en cruz -->
    <path d="M226 676 L298 610" stroke="#2a2d31" stroke-width="9" stroke-linecap="round"/>
    <path d="M226 676 L298 610" stroke="url(#acero)" stroke-width="5" stroke-linecap="round"/>
    <!-- puño de cuero y pomo de rueda -->
    <path d="M254 632 L214 560 L230 552 L270 624 Z" fill="#2a1a10"/>
    <g stroke="#6b4a32" stroke-width="1.6" opacity="0.8"><path d="M220 568 L234 560"/><path d="M226 580 L240 572"/><path d="M232 592 L246 584"/><path d="M238 604 L252 596"/><path d="M244 616 L258 608"/></g>
    <ellipse cx="214" cy="548" rx="14" ry="12" fill="url(#acero)"/>
    <ellipse cx="214" cy="548" rx="5" ry="4" fill="#2a2d31"/>
    <path d="M206 540 C210 536 218 536 222 540" stroke="#eef1f3" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- ===================== CAPUCHA BAJADA (capelina sobre los hombros) ===================== -->
  <path d="M248 262 C268 236 432 236 452 262 C500 280 528 300 524 324 C470 360 400 400 350 448 C300 400 230 360 176 324 C172 300 200 280 248 262 Z" fill="url(#capucha)"/>
  <path d="M350 300 C348 350 350 400 350 446 C330 420 300 392 270 370 C300 360 330 330 350 300 Z" fill="#1d140c" opacity="0.45"/>
  <path d="M392 262 C430 270 470 290 500 312 C470 318 430 312 400 290 Z" fill="#8a7050" opacity="0.45"/>
  <path d="M250 268 C230 282 206 300 190 318 C214 322 240 312 262 292 Z" fill="#1d140c" opacity="0.35"/>
  <path d="M176 324 C230 360 300 400 350 448 C400 400 470 360 524 324" stroke="#120c07" stroke-width="2.5" fill="none" opacity="0.8"/>
  <path d="M300 300 C320 340 336 390 348 440 M404 300 C384 340 366 390 354 440" stroke="#1d140c" stroke-width="2" fill="none" opacity="0.5"/>

  <!-- oclusión bajo la capelina y el cinturón -->
  <path d="M190 330 C240 360 300 400 350 452 C400 400 460 360 510 330 C470 380 410 420 350 470 C290 420 230 380 190 330 Z" fill="#000" opacity="0.35" filter="url(#blur5)"/>
  <path d="M212 622 C262 640 438 640 490 622 C440 660 262 660 212 622 Z" fill="#000" opacity="0.35" filter="url(#blur5)"/>

  <!-- ===================== CABEZA Y PELO (hasta los hombros, peinado hacia atrás) ===================== -->
  <!-- orejas -->
  <path d="M298 150 C286 146 282 170 290 182 C294 188 300 186 301 180 Z" fill="url(#piel)"/>
  <path d="M402 150 C414 146 418 170 410 182 C406 188 400 186 399 180 Z" fill="url(#piel)"/>
  <!-- nuca -->
  <path d="M318 220 C320 246 322 262 326 276 L374 276 C378 262 380 246 382 220 Z" fill="#9a6a4e"/>
  <!-- pelo -->
  <path d="M290 136 C288 94 316 68 350 68 C384 68 412 94 410 136 C410 170 404 196 404 220 C408 240 418 256 428 268 C414 276 404 272 396 280 C386 274 378 284 366 280 C356 288 344 288 334 280 C322 284 314 274 304 280 C296 272 286 276 272 268 C282 256 292 240 296 220 C296 196 290 170 290 136 Z" fill="url(#pelo)"/>
  <g clip-path="url(#cPelo)">
    <g filter="url(#blur2)">
      <path d="M332 80 C326 140 324 200 318 270" stroke="#7a5534" stroke-width="5" opacity="0.6"/>
      <path d="M362 78 C366 140 370 200 378 272" stroke="#8a6440" stroke-width="7" opacity="0.6"/>
      <path d="M384 92 C392 150 398 210 410 262" stroke="#6a4a2e" stroke-width="4" opacity="0.5"/>
      <path d="M312 96 C306 150 302 210 292 262" stroke="#120c08" stroke-width="6" opacity="0.6"/>
      <path d="M346 80 C346 150 346 210 348 280" stroke="#120c08" stroke-width="3" opacity="0.5"/>
    </g>
    <g stroke="#0e0906" stroke-width="1" opacity="0.5">
      <path d="M322 90 C316 150 312 210 302 270"/><path d="M340 82 C338 150 336 210 334 278"/><path d="M356 82 C358 150 360 210 364 280"/>
      <path d="M374 88 C380 150 384 210 394 274"/><path d="M392 104 C398 160 402 220 412 266"/>
    </g>
    <!-- puntas sueltas sobre la capelina -->
    <path d="M286 262 C300 276 320 282 334 282 M368 282 C384 282 402 276 414 262" stroke="#2a1c12" stroke-width="2" opacity="0.7"/>
  </g>
  <!-- volumen del cráneo y mechones que caen sobre la capelina -->
  <ellipse cx="364" cy="118" rx="40" ry="44" fill="#a07650" opacity="0.28" filter="url(#blur10)"/>
  <g stroke-linecap="round" fill="none" filter="url(#blur2)">
    <path d="M300 262 C298 276 292 288 284 296" stroke="#2c1d12" stroke-width="7"/>
    <path d="M322 270 C322 284 318 294 312 302" stroke="#3a2718" stroke-width="7"/>
    <path d="M378 272 C380 286 386 296 392 302" stroke="#4a3220" stroke-width="7"/>
    <path d="M402 262 C406 276 414 288 422 294" stroke="#3a2718" stroke-width="7"/>
    <path d="M350 280 C350 292 352 300 354 306" stroke="#2c1d12" stroke-width="6"/>
  </g>
  <path d="M290 140 C290 200 296 240 284 266" stroke="#0e0906" stroke-width="3" fill="none" opacity="0.5"/>
  <!-- luz de contorno fría (contraluz desde la izquierda) -->
  <path d="M298 138 C296 104 316 80 344 76" stroke="#b8c8d8" stroke-width="3" opacity="0.55" filter="url(#blur2)"/>
  <!-- luz cálida principal en el lado derecho -->
</svg>
