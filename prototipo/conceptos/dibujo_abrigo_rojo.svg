      <path d="M462 640 C472 760 482 880 492 1040 L516 1036 C506 880 494 760 480 650 Z" fill="#200807" opacity="0.6"/>
      <path d="M262 650 C258 790 258 910 262 1046" stroke="#c24a35" stroke-width="10" opacity="0.35"/>
      <path d="M424 650 C428 790 434 910 440 1046" stroke="#d65a40" stroke-width="12" opacity="0.4"/>
      <path d="M362 720 C366 840 368 940 372 1046" stroke="#c84c37" stroke-width="7" opacity="0.35"/>
      <!-- omóplatos y espalda -->
      <ellipse cx="292" cy="410" rx="50" ry="70" fill="#a83a2a" opacity="0.35"/>
      <ellipse cx="412" cy="410" rx="56" ry="72" fill="#b9432f" opacity="0.45"/>
      <path d="M350 330 C346 420 348 500 350 560" stroke="#3a0e0a" stroke-width="10" opacity="0.5"/>
      <!-- cintura recogida bajo el cinturón -->
      <path d="M210 600 C260 616 440 616 490 600 L496 640 C440 656 260 656 204 640 Z" fill="#2a0b08" opacity="0.55"/>
      <!-- costuras laterales en sombra -->
      <path d="M206 300 C192 420 200 520 214 580" stroke="#140504" stroke-width="16" opacity="0.6"/>
      <path d="M494 300 C508 420 500 520 486 580" stroke="#2a0a07" stroke-width="12" opacity="0.45"/>
    </g>
    <!-- costuras y desgaste del bajo -->
    <path d="M216 560 C260 572 440 572 484 560" stroke="#2e0c09" stroke-width="2" opacity="0.6"/>
    <path d="M162 1018 C212 1040 272 1046 350 1046 C428 1046 488 1040 538 1018" stroke="#d26a50" stroke-width="2" opacity="0.4"/>
    <path d="M186 1004 l6 18 l8 -14 l7 16 M480 1010 l6 14 l7 -12 l8 12" stroke="#2a0a07" stroke-width="2" fill="none" opacity="0.5"/>
  </g>
  <use href="#abrigoForma" fill="#000" opacity="0.04" filter="url(#grano)"/>

  <!-- ===================== MANGAS OSCURAS Y MANOS ===================== -->
  <path d="M206 300 C180 330 168 400 166 480 C164 540 168 590 178 636 L216 632 C212 580 214 520 220 460 C224 400 226 340 222 300 Z" fill="url(#manga)"/>
  <path d="M494 300 C520 330 532 400 534 480 C536 540 532 590 522 636 L484 632 C488 580 486 520 480 460 C476 400 474 340 478 300 Z" fill="url(#manga)"/>
  <g filter="url(#blur5)">
    <path d="M200 420 C196 470 196 520 200 580" stroke="#6a5c50" stroke-width="6" opacity="0.4"/>
    <path d="M510 420 C516 470 516 520 512 580" stroke="#7a6a5c" stroke-width="7" opacity="0.45"/>
    <path d="M176 500 C190 506 206 506 218 500" stroke="#0a0807" stroke-width="5" opacity="0.6"/>
    <path d="M482 500 C496 506 512 506 524 500" stroke="#0a0807" stroke-width="5" opacity="0.6"/>
  </g>
  <!-- brazales -->
  <path d="M176 560 C190 552 210 552 220 560 L218 636 C206 642 188 642 178 636 Z" fill="url(#cuero)"/>
  <path d="M480 560 C490 552 510 552 524 560 L522 636 C512 642 494 642 482 636 Z" fill="url(#cuero)"/>
  <path d="M178 586 C190 580 208 580 220 586 M178 614 C190 608 208 608 219 614" stroke="#1c120b" stroke-width="2" opacity="0.7"/>
  <path d="M480 586 C492 580 510 580 523 586 M481 614 C492 608 510 608 522 614" stroke="#1c120b" stroke-width="2" opacity="0.7"/>
