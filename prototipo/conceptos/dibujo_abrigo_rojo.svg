<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 1300" width="700" height="1300">
  <title>Héroe de espaldas: abrigo largo rojo (pintura con volumen)</title>
  <defs>
    <!-- grano de tela -->
    <filter id="grano" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="9" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComposite in="g" in2="SourceGraphic" operator="in" result="gi"/>
      <feBlend in="SourceGraphic" in2="gi" mode="soft-light"/>
    </filter>
    <filter id="blur2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="blur5" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="blur10" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>

    <!-- materiales -->
    <linearGradient id="rojo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a1410"/><stop offset="0.25" stop-color="#7d241b"/><stop offset="0.6" stop-color="#9a3426"/>
      <stop offset="0.85" stop-color="#7a2219"/><stop offset="1" stop-color="#3e110d"/>
    </linearGradient>
    <linearGradient id="rojoV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="0.75" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#1a0806" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="capucha" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#2e2318"/><stop offset="0.5" stop-color="#5c4632"/><stop offset="0.8" stop-color="#6f5840"/><stop offset="1" stop-color="#352819"/>
    </linearGradient>
    <linearGradient id="manga" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#151210"/><stop offset="0.55" stop-color="#3a322b"/><stop offset="1" stop-color="#1b1714"/>
    </linearGradient>
    <linearGradient id="cuero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6e4a2e"/><stop offset="0.55" stop-color="#4a2f1d"/><stop offset="1" stop-color="#24170e"/>
    </linearGradient>
    <linearGradient id="fajin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9874c"/><stop offset="0.5" stop-color="#8a6a36"/><stop offset="1" stop-color="#5c4421"/>
    </linearGradient>
    <linearGradient id="pelo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c130d"/><stop offset="0.45" stop-color="#4a3322"/><stop offset="0.7" stop-color="#5e4229"/><stop offset="1" stop-color="#20160f"/>
    </linearGradient>
    <linearGradient id="pantalon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#191512"/><stop offset="0.5" stop-color="#3a3029"/><stop offset="1" stop-color="#16120f"/>
    </linearGradient>
    <linearGradient id="bota" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#140e0a"/><stop offset="0.5" stop-color="#3c2a1d"/><stop offset="0.65" stop-color="#5a4130"/><stop offset="1" stop-color="#120c08"/>
    </linearGradient>
    <linearGradient id="vaina" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b3020"/><stop offset="0.45" stop-color="#2c1b11"/><stop offset="1" stop-color="#120b07"/>
    </linearGradient>
    <linearGradient id="acero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b3f44"/><stop offset="0.45" stop-color="#c6cbd0"/><stop offset="0.55" stop-color="#8f969d"/><stop offset="1" stop-color="#2c2f33"/>
    </linearGradient>
    <linearGradient id="piel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8c5c44"/><stop offset="0.6" stop-color="#c58f6d"/><stop offset="1" stop-color="#7a4d38"/>
    </linearGradient>

    <!-- recortes para sombrear dentro de cada pieza -->
    <clipPath id="cAbrigo"><path id="abrigoForma" d="M206 290 C190 380 196 470 214 560 C204 650 186 760 172 880 C166 940 162 990 160 1020 C210 1042 270 1050 350 1050 C430 1050 490 1042 540 1020 C538 990 534 940 528 880 C514 760 496 650 486 560 C504 470 510 380 494 290 C450 268 250 268 206 290 Z"/></clipPath>
    <clipPath id="cCapucha"><path d="M248 262 C268 236 432 236 452 262 C500 280 528 300 524 324 C470 360 400 400 350 448 C300 400 230 360 176 324 C172 300 200 280 248 262 Z"/></clipPath>
    <clipPath id="cPelo"><path d="M290 136 C288 94 316 68 350 68 C384 68 412 94 410 136 C410 170 404 196 404 220 C408 240 418 256 428 268 C414 276 404 272 396 280 C386 274 378 284 366 280 C356 288 344 288 334 280 C322 284 314 274 304 280 C296 272 286 276 272 268 C282 256 292 240 296 220 C296 196 290 170 290 136 Z"/></clipPath>
  </defs>

  <!-- sombra de contacto -->
  <ellipse cx="352" cy="1262" rx="170" ry="20" fill="#000" opacity="0.28" filter="url(#blur10)"/>

  <!-- ===================== PIERNAS ===================== -->
  <path d="M262 980 C258 1060 258 1120 262 1170 L332 1170 C334 1110 336 1050 340 980 Z" fill="url(#pantalon)"/>
  <path d="M360 980 C364 1050 368 1110 372 1170 L442 1170 C446 1120 446 1060 440 980 Z" fill="url(#pantalon)"/>
  <!-- botas de media caña -->
  <path d="M256 1100 C254 1150 254 1200 258 1234 C258 1248 252 1258 244 1264 C268 1272 316 1272 340 1266 C340 1244 338 1200 338 1100 C312 1092 280 1092 256 1100 Z" fill="url(#bota)"/>
  <path d="M366 1100 C366 1200 364 1244 364 1266 C388 1272 436 1272 460 1264 C452 1258 446 1248 446 1234 C450 1200 450 1150 448 1100 C424 1092 392 1092 366 1100 Z" fill="url(#bota)"/>
  <path d="M256 1100 C280 1092 312 1092 338 1100 L338 1114 C312 1106 280 1106 256 1114 Z" fill="#5a4130" opacity="0.8"/>
  <path d="M366 1100 C392 1092 424 1092 448 1100 L448 1114 C424 1106 392 1106 366 1114 Z" fill="#5a4130" opacity="0.8"/>
  <path d="M300 1118 C302 1170 302 1220 300 1262" stroke="#7a5a40" stroke-width="3" opacity="0.35" filter="url(#blur2)"/>
  <path d="M408 1118 C406 1170 406 1220 408 1262" stroke="#7a5a40" stroke-width="3" opacity="0.35" filter="url(#blur2)"/>

  <!-- ===================== ABRIGO ROJO ===================== -->
  <use href="#abrigoForma" fill="url(#rojo)"/>
  <g clip-path="url(#cAbrigo)">
    <rect x="150" y="260" width="400" height="800" fill="url(#rojoV)"/>
    <!-- abertura trasera (desde la cadera hasta el bajo) -->
    <path d="M346 700 C344 820 342 930 340 1052 L360 1052 C358 930 356 820 354 700 Z" fill="#160806"/>
