  <path d="M178 634 C170 660 172 690 182 708 C190 722 206 724 214 712 C222 700 222 672 218 634 Z" fill="#1f1510"/>
  <path d="M182 704 C184 722 190 736 198 740 C206 744 214 736 214 722 C214 714 212 708 212 704 Z" fill="url(#piel)"/>
  <path d="M190 712 C192 726 196 734 200 738 M200 712 C202 724 204 732 208 736" stroke="#5e3a28" stroke-width="1.4" opacity="0.7"/>
  <path d="M522 634 C530 660 528 690 518 708 C510 722 494 724 486 712 C478 700 478 672 482 634 Z" fill="#1f1510"/>
  <path d="M518 704 C516 722 510 736 502 740 C494 744 486 736 486 722 C486 714 488 708 488 704 Z" fill="url(#piel)"/>
  <path d="M510 712 C508 726 504 734 500 738 M500 712 C498 724 496 732 492 736" stroke="#5e3a28" stroke-width="1.4" opacity="0.7"/>
  <path d="M196 640 C198 670 198 690 196 704" stroke="#5a4130" stroke-width="3" opacity="0.4" filter="url(#blur2)"/>
  <path d="M506 640 C504 670 504 690 506 704" stroke="#6a5040" stroke-width="3" opacity="0.5" filter="url(#blur2)"/>

  <!-- ===================== HOMBRERA ÚNICA (hombro izquierdo: a la izquierda del dibujo, de espaldas) ===================== -->
  <path d="M168 312 C176 280 206 266 240 270 L246 330 C220 334 196 346 178 366 Z" fill="url(#cuero)"/>
  <path d="M164 346 C172 320 200 308 232 310 L238 366 C214 370 190 382 172 402 Z" fill="#3a2517"/>
  <path d="M162 382 C170 360 196 350 226 352 L232 404 C208 408 186 418 168 436 Z" fill="url(#cuero)"/>
  <path d="M168 436 C186 418 208 408 232 404" stroke="url(#acero)" stroke-width="5"/>
  <g fill="#b9bec4"><circle cx="210" cy="290" r="3.2"/><circle cx="206" cy="330" r="3.2"/><circle cx="202" cy="372" r="3.2"/></g>
  <path d="M176 300 C196 286 222 280 238 282" stroke="#a37a55" stroke-width="3" opacity="0.5" filter="url(#blur2)"/>

  <!-- ===================== CINTURÓN Y FAJÍN ===================== -->
  <path d="M210 572 C260 588 440 588 490 572 L494 606 C440 622 260 622 206 606 Z" fill="url(#fajin)"/>
  <path d="M212 600 C262 614 438 614 492 600 L494 618 C438 634 262 634 210 618 Z" fill="url(#cuero)"/>
  <path d="M224 582 C276 594 424 594 476 582" stroke="#c9a868" stroke-width="2" opacity="0.5" filter="url(#blur2)"/>
  <!-- nudo del fajín a la derecha (del dibujo) -->
  <path d="M452 596 C470 610 478 640 474 676 C466 690 456 690 452 680 C454 652 450 624 440 606 Z" fill="url(#fajin)"/>
  <path d="M464 600 C484 616 496 646 494 680 C488 690 480 690 478 682 C480 650 474 624 458 604 Z" fill="#7a5c2e"/>

  <!-- ===================== ESPADA MEDIEVAL (cuelga en diagonal por detrás) ===================== -->
  <g transform="translate(14 34)">
    <!-- vaina: de la cadera izquierda baja cruzando hacia la pantorrilla derecha -->
    <path d="M252 640 L506 1110 L524 1100 L272 628 Z" fill="url(#vaina)"/>
    <path d="M262 640 L512 1102" stroke="#6b4a32" stroke-width="2" opacity="0.6"/>
    <path d="M496 1092 L530 1072 L548 1112 C542 1124 524 1128 516 1120 Z" fill="url(#acero)"/>
    <path d="M268 650 L296 634 L308 656 L280 672 Z" fill="url(#acero)"/>
