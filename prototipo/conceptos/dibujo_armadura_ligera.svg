    </g>
    <rect x="392" y="1172" width="16" height="16" rx="2" fill="url(#metal)" stroke-width="1.2"/>
    <rect x="492" y="1172" width="16" height="16" rx="2" fill="url(#metal)" stroke-width="1.2"/>

    <!-- faldones delanteros del abrigo (abiertos en el centro) -->
    <path d="M330 690 C312 820 300 960 292 1110 C330 1124 380 1128 424 1122 C428 980 432 840 438 700 Z" fill="url(#abrigoL)" stroke-width="2.8"/>
    <path d="M570 690 C588 820 600 960 608 1110 C570 1124 520 1128 476 1122 C472 980 468 840 462 700 Z" fill="url(#abrigoL)" stroke-width="2.8"/>
    <g stroke="#15110e" stroke-width="1.3" fill="none" opacity="0.55">
      <path d="M360 760 C352 880 344 1000 338 1116"/><path d="M402 740 C398 880 396 1000 394 1120"/>
      <path d="M540 760 C548 880 556 1000 562 1116"/><path d="M498 740 C502 880 504 1000 506 1120"/>
    </g>
    <path d="M296 1100 C330 1116 380 1120 424 1114" stroke="#8a6b47" stroke-width="2" fill="none"/>
    <path d="M604 1100 C570 1116 520 1120 476 1114" stroke="#8a6b47" stroke-width="2" fill="none"/>

