    <path d="M306 692 C300 716 302 740 312 760 C320 774 334 778 344 768 C352 758 352 730 350 692 Z" fill="#2a1c14" stroke-width="2.2"/>
    <path d="M310 756 C304 776 308 800 320 812 C332 822 348 818 354 804 C358 792 356 776 350 760 Z" fill="url(#piel)" stroke-width="2.2"/>
    <path d="M322 770 C322 790 326 806 332 814 M334 770 C336 790 340 804 344 810 M344 768 C346 784 350 796 352 800" stroke="#9b6a4f" stroke-width="1.3" fill="none"/>
    <path d="M348 744 C360 752 364 770 358 784" fill="none" stroke="#9b6a4f" stroke-width="1.3"/>
    <path d="M350 742 C364 748 366 766 360 780 C356 786 350 784 350 776 Z" fill="url(#piel)" stroke-width="2"/>
    <path d="M594 692 C600 716 598 740 588 760 C580 774 566 778 556 768 C548 758 548 730 550 692 Z" fill="#2a1c14" stroke-width="2.2"/>
    <path d="M590 756 C596 776 592 800 580 812 C568 822 552 818 546 804 C542 792 544 776 550 760 Z" fill="url(#piel)" stroke-width="2.2"/>
    <path d="M578 770 C578 790 574 806 568 814 M566 770 C564 790 560 804 556 810 M556 768 C554 784 550 796 548 800" stroke="#9b6a4f" stroke-width="1.3" fill="none"/>
    <path d="M550 742 C536 748 534 766 540 780 C544 786 550 784 550 776 Z" fill="url(#piel)" stroke-width="2"/>
    <!-- empuñadura de la espada: delante de la cadera izquierda, apuntando arriba y hacia delante -->
    <g>
      <path d="M598 704 L548 610 L562 602 L612 696 Z" fill="url(#metal)" stroke-width="2"/>
      <g stroke="#2a2e33" stroke-width="2.2">
        <path d="M556 622 L570 614"/><path d="M562 634 L576 626"/><path d="M568 646 L582 638"/><path d="M574 658 L588 650"/><path d="M580 670 L594 662"/>
      </g>
      <path d="M560 618 L574 610 L590 640 L576 648 Z" fill="#2b1a12" stroke-width="1.4" opacity="0.85"/>
      <ellipse cx="609" cy="706" rx="22" ry="9" transform="rotate(-28 609 706)" fill="#1d2126" stroke-width="2"/>
      <ellipse cx="616" cy="718" rx="9" ry="5" transform="rotate(-28 616 718)" fill="#6fd2ff" stroke="none" filter="url(#brillo)"/>
      <path d="M548 610 L544 596 L558 590 L562 602 Z" fill="#2a2e33" stroke-width="1.6"/>
      <circle cx="575" cy="636" r="2.6" fill="#7fd8ff" stroke="none" filter="url(#brillo)"/>
    </g>

    <!-- hombreras de láminas solapadas; la izquierda del personaje (derecha del dibujo) con borde metálico -->
    <path d="M296 360 C300 330 330 316 366 322 L376 372 C346 380 316 392 300 412 Z" fill="url(#cuero)" stroke-width="2.4"/>
    <path d="M290 392 C296 372 326 360 362 364 L368 410 C338 414 310 426 294 446 Z" fill="url(#cueroOsc)" stroke-width="2.4"/>
    <path d="M288 428 C294 410 322 400 356 404 L360 446 C332 450 306 460 290 478 Z" fill="url(#cuero)" stroke-width="2.4"/>
    <path d="M604 352 C598 320 564 306 526 314 L518 372 C552 378 586 392 604 414 Z" fill="url(#cuero)" stroke-width="2.6"/>
    <path d="M612 388 C606 364 572 352 534 356 L530 410 C564 414 594 428 612 450 Z" fill="url(#cueroOsc)" stroke-width="2.6"/>
    <path d="M616 426 C610 404 578 394 540 398 L538 450 C572 454 600 466 616 488 Z" fill="url(#cuero)" stroke-width="2.6"/>
    <path d="M616 488 C600 466 572 454 538 450" stroke="url(#metal)" stroke-width="6" fill="none"/>
    <g fill="url(#metal)" stroke-width="1"><circle cx="560" cy="330" r="4"/><circle cx="566" cy="372" r="4"/><circle cx="572" cy="414" r="4"/><circle cx="340" cy="336" r="3.5"/><circle cx="334" cy="378" r="3.5"/></g>

    <!-- cuello envolvente (bufanda gruesa) -->
    <path d="M376 330 C390 296 510 296 524 330 C540 352 520 376 496 380 C470 390 430 390 404 380 C380 376 360 352 376 330 Z" fill="url(#bufanda)" stroke-width="2.6"/>
    <g stroke="#3b352b" stroke-width="1.4" fill="none" opacity="0.8">
      <path d="M392 340 C420 356 480 356 508 340"/><path d="M386 358 C420 374 480 374 514 358"/><path d="M470 300 C478 320 486 350 492 378"/>
    </g>

    <!-- cuello y cabeza -->
    <path d="M422 268 L420 322 C436 334 464 334 480 322 L478 268 Z" fill="url(#piel)" stroke-width="2.2"/>
    <path d="M404 186 C400 150 420 120 450 118 C482 118 502 148 498 188 C496 226 488 260 470 280 C460 292 440 292 430 280 C412 260 404 226 404 186 Z" fill="url(#piel)" stroke-width="2.6"/>
    <!-- orejas -->
    <path d="M404 196 C394 192 392 214 400 224 C404 228 408 226 408 220" fill="url(#piel)" stroke-width="2"/>
    <path d="M498 196 C508 192 510 214 502 224 C498 228 494 226 494 220" fill="url(#piel)" stroke-width="2"/>
    <!-- pelo peinado hacia atrás (raya en medio apenas marcada, mechones hacia la nuca) -->
    <path d="M400 190 C396 140 418 108 452 106 C488 106 508 136 502 190 C496 160 484 142 470 136 C458 132 444 132 432 136 C418 142 406 160 400 190 Z" fill="url(#pelo)" stroke-width="2.4"/>
    <g stroke="#1a100a" stroke-width="1.2" fill="none" opacity="0.7">
      <path d="M418 140 C430 126 446 120 460 120"/><path d="M412 160 C426 140 446 130 470 130"/><path d="M488 150 C478 136 466 128 452 126"/><path d="M496 172 C488 150 474 138 458 134"/>
    </g>
    <!-- rasgos -->
    <path d="M422 190 C430 184 440 184 446 190" stroke-width="3" fill="none"/>
    <path d="M478 190 C470 184 460 184 454 190" stroke-width="3" fill="none"/>
    <path d="M426 202 C432 198 440 198 444 202 C440 206 432 206 426 202 Z" fill="#f6efe6" stroke-width="1.6"/>
    <path d="M474 202 C468 198 460 198 456 202 C460 206 468 206 474 202 Z" fill="#f6efe6" stroke-width="1.6"/>
    <circle cx="436" cy="202" r="2.6" fill="#3d5a4e" stroke="none"/><circle cx="464" cy="202" r="2.6" fill="#3d5a4e" stroke="none"/>
    <path d="M450 204 C448 220 444 232 442 238 C446 242 454 242 458 238" stroke-width="2" fill="none"/>
    <path d="M436 256 C444 260 456 260 464 256" stroke-width="2.2" fill="none"/>
    <!-- barba de pocos días y cicatriz -->
    <path d="M412 236 C420 268 438 284 450 286 C462 284 480 268 488 236 C478 262 462 274 450 274 C438 274 422 262 412 236 Z" fill="#5a3f2e" stroke="none" opacity="0.35"/>
    <path d="M476 214 L486 236" stroke="#a4655a" stroke-width="1.8" fill="none"/>
    <path d="M420 228 C428 236 432 246 432 252 M480 228 C472 236 468 246 468 252" stroke="#8a5f45" stroke-width="1.2" fill="none" opacity="0.6"/>
  </g>

  <!-- cartela -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#2b2016">
    <text x="40" y="1360" font-size="26" font-style="italic">Héroe — armadura ligera (concepto)</text>
    <text x="40" y="1386" font-size="15" opacity="0.8">gambesón acolchado · peto de cuero · hombreras de láminas · bandolera con cápsulas · espada híbrida</text>
  </g>
</svg>
