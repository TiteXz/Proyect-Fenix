    <path d="M350 382 C344 450 350 540 372 600 C400 624 500 624 528 600 C550 540 556 450 550 382 C510 366 390 366 350 382 Z" fill="url(#cuero)" stroke-width="2.6"/>
    <path d="M350 382 C344 450 350 540 372 600 C400 624 500 624 528 600 C550 540 556 450 550 382 C510 366 390 366 350 382 Z" fill="url(#tramaCuero)" stroke="none"/>
    <path d="M450 392 V606" stroke="#1d120c" stroke-width="1.6" opacity="0.7"/>
    <g stroke="#caa36c" stroke-width="1.1" stroke-dasharray="4 4" fill="none" opacity="0.75">
      <path d="M358 392 C352 456 358 536 378 592"/><path d="M542 392 C548 456 542 536 522 592"/>
      <path d="M378 596 C404 614 496 614 522 596"/>
    </g>
    <path d="M372 600 C400 624 500 624 528 600 L534 650 C500 668 400 668 366 650 Z" fill="url(#cueroOsc)" stroke-width="2.4"/>

    <!-- cinturón ancho, hebilla y bolsas -->
    <path d="M326 664 C380 680 520 680 574 664 L576 708 C520 722 380 722 324 708 Z" fill="#3a2418" stroke-width="2.6"/>
    <rect x="428" y="668" width="44" height="40" rx="5" fill="url(#metal)" stroke-width="2"/>
    <rect x="440" y="680" width="20" height="16" rx="3" fill="#2a2e33" stroke-width="1.4"/>
    <path d="M336 694 h44 v52 c0 8 -6 12 -14 12 h-16 c-8 0 -14 -4 -14 -12 Z" fill="url(#cueroOsc)" stroke-width="2.2"/>
