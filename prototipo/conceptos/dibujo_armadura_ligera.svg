<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" width="900" height="1400">
  <title>Concepto: armadura ligera del héroe (dibujo)</title>
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fa6c9"/><stop offset="0.55" stop-color="#e8d2b0"/><stop offset="1" stop-color="#f3dcc0"/>
    </linearGradient>
    <linearGradient id="suelo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c8763"/><stop offset="1" stop-color="#5e4e38"/>
    </linearGradient>
    <linearGradient id="cuero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a4630"/><stop offset="0.6" stop-color="#4a2f20"/><stop offset="1" stop-color="#2e1d14"/>
    </linearGradient>
    <linearGradient id="cueroOsc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d2a20"/><stop offset="1" stop-color="#1c130e"/>
    </linearGradient>
    <linearGradient id="abrigo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4038"/><stop offset="1" stop-color="#2a241f"/>
    </linearGradient>
    <linearGradient id="abrigoL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a241f"/><stop offset="0.5" stop-color="#4f453c"/><stop offset="1" stop-color="#2e2722"/>
    </linearGradient>
    <linearGradient id="piel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9c3a2"/><stop offset="1" stop-color="#b98564"/>
    </linearGradient>
    <linearGradient id="pelo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a271b"/><stop offset="0.5" stop-color="#5a3c28"/><stop offset="1" stop-color="#2b1c13"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5d636b"/><stop offset="0.45" stop-color="#d9dde2"/><stop offset="0.55" stop-color="#9aa1aa"/><stop offset="1" stop-color="#40454c"/>
    </linearGradient>
    <linearGradient id="bufanda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c7260"/><stop offset="1" stop-color="#4f483c"/>
    </linearGradient>
    <pattern id="acolchado" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="22" height="22" fill="#3a3734"/>
      <rect x="1.5" y="1.5" width="19" height="19" rx="6" fill="#4b4743"/>
      <path d="M0 0H22M0 0V22" stroke="#1f1d1b" stroke-width="1.6"/>
    </pattern>
    <pattern id="tramaCuero" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.7" fill="#000" opacity="0.18"/><circle cx="5" cy="4.5" r="0.5" fill="#fff" opacity="0.05"/>
    </pattern>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="suave"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- fondo: atardecer luminoso sobre colinas -->
  <rect width="900" height="1400" fill="url(#cielo)"/>
  <circle cx="690" cy="520" r="90" fill="#fff1d6" opacity="0.55" filter="url(#suave)"/>
  <path d="M0 880 C150 820 260 860 380 830 C520 790 640 850 900 810 V1400 H0Z" fill="#8f9a86" opacity="0.55"/>
  <path d="M0 960 C200 920 330 950 470 930 C650 905 760 950 900 930 V1400 H0Z" fill="#7a8a6c" opacity="0.6"/>
  <path d="M0 1080 C250 1050 600 1060 900 1040 V1400 H0Z" fill="url(#suelo)"/>
  <ellipse cx="450" cy="1318" rx="190" ry="26" fill="#2c2318" opacity="0.45"/>

  <g stroke="#1a1310" stroke-linejoin="round" stroke-linecap="round">

    <!-- pelo largo y liso por detrás de los hombros -->
    <path d="M392 168 C360 230 356 330 362 430 C366 520 378 600 392 640 L508 640 C522 600 534 520 538 430 C544 330 540 230 508 168 Z" fill="url(#pelo)" stroke-width="2.5"/>
    <g stroke="#1c120c" stroke-width="1.2" fill="none" opacity="0.6">
      <path d="M380 260 C372 380 380 520 396 630"/><path d="M398 250 C392 390 398 520 410 636"/>
      <path d="M520 260 C528 380 520 520 504 630"/><path d="M502 250 C508 390 502 520 490 636"/>
    </g>

    <!-- faldones traseros del abrigo -->
    <path d="M318 700 C300 860 290 1000 284 1130 L452 1130 L452 700 Z" fill="#241e1a" stroke-width="2.5"/>
    <path d="M582 700 C600 860 610 1000 616 1130 L448 1130 L448 700 Z" fill="#241e1a" stroke-width="2.5"/>

    <!-- espada: saya por detrás del faldón izquierdo (a la derecha del dibujo), baja hacia atrás -->
    <path d="M610 712 C660 790 700 880 735 990 L748 984 C716 876 676 786 624 704 Z" fill="#0e1014" stroke-width="2"/>
    <path d="M618 716 C664 792 702 880 736 984" stroke="#59c8ff" stroke-width="2" fill="none" filter="url(#brillo)"/>
    <rect x="726" y="972" width="22" height="26" rx="4" transform="rotate(-20 737 985)" fill="url(#metal)" stroke-width="1.6"/>
    <rect x="645" y="758" width="20" height="8" rx="2" transform="rotate(-35 655 762)" fill="url(#metal)" stroke-width="1.2"/>

    <!-- piernas: pantalón y botas altas con vuelta -->
    <path d="M378 760 L372 1010 L432 1010 L446 760 Z" fill="#3b3128" stroke-width="2.5"/>
    <path d="M522 760 L528 1010 L468 1010 L454 760 Z" fill="#3b3128" stroke-width="2.5"/>
    <path d="M368 1000 L366 1262 C366 1290 360 1304 336 1312 C320 1318 322 1330 342 1330 L436 1330 C444 1330 446 1318 440 1300 L438 1000 Z" fill="url(#cueroOsc)" stroke-width="2.5"/>
    <path d="M532 1000 L534 1262 C534 1290 540 1304 564 1312 C580 1318 578 1330 558 1330 L464 1330 C456 1330 454 1318 460 1300 L462 1000 Z" fill="url(#cueroOsc)" stroke-width="2.5"/>
    <path d="M362 990 L444 990 L446 1032 L360 1032 Z" fill="#4a3225" stroke-width="2.2"/>
    <path d="M538 990 L456 990 L454 1032 L540 1032 Z" fill="#4a3225" stroke-width="2.2"/>
