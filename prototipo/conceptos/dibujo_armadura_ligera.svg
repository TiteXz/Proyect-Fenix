      <rect x="432" y="470" width="16" height="26" rx="5" transform="rotate(-34 440 483)" fill="url(#metal)"/>
      <rect x="466" y="520" width="16" height="26" rx="5" transform="rotate(-34 474 533)" fill="url(#metal)"/>
      <rect x="500" y="570" width="16" height="26" rx="5" transform="rotate(-34 508 583)" fill="url(#metal)"/>
    </g>
