<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Idle de magia</title>
<style>
  :root { --bg: #dfe8f0; --panel: rgba(255,255,255,.82); --ink: #1d2733; --mute: #5a6878; --acc: #2f7fd0; --line: rgba(29,39,51,.14); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #ui { position: fixed; left: 16px; top: 16px; width: 300px; max-width: calc(100% - 32px); background: var(--panel); backdrop-filter: blur(8px);
        border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 10px; }
  h1 { font-size: 15px; margin: 0; }
  .sub { color: var(--mute); font-size: 12px; margin: 0; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row label { flex: 1; min-width: 90px; }
  input[type=range] { width: 100%; accent-color: var(--acc); }
  button { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
  button.on { background: var(--acc); color: #fff; border-color: var(--acc); }
  #meter { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  #meter > div { height: 100%; width: 0; background: linear-gradient(90deg, #7cc4ff, #ffd98a); }
  #estado { font-weight: 600; }
  #pad { position: fixed; right: 16px; bottom: 16px; display: none; grid-template-columns: repeat(3, 48px); gap: 6px; }
  #pad button { height: 48px; font-size: 18px; padding: 0; }
  @media (pointer: coarse) { #pad { display: grid; } }
  @media (max-width: 560px) { #ui { top: auto; bottom: 16px; width: auto; right: 16px; } #pad { bottom: auto; top: 16px; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ui">
  <div><h1>Idle de magia</h1><p class="sub">Quédate quieto: tras la espera levanta la mano izquierda y mueve una bola de magia. WASD / flechas para andar (arrastra para girar la cámara).</p></div>
  <div><div class="row"><span id="estado">Cargando…</span><span class="sub" id="reloj" style="margin-left:auto"></span></div><div id="meter"><div></div></div></div>
  <div class="row"><label for="rEspera">Espera <b id="vEspera">5</b> s</label><input id="rEspera" type="range" min="1" max="15" step="0.5" value="5"></div>
  <div class="row"><label for="rVel">Velocidad <b id="vVel">1</b>×</label><input id="rVel" type="range" min="0.25" max="2" step="0.25" value="1"></div>
  <div class="row"><button id="bForzar">Forzar idle</button><button id="bPasear">Pasear</button><button id="bPausa">Pausa</button></div>
</div>
<div id="pad"><span></span><button data-k="w">▲</button><span></span><button data-k="a">◄</button><button data-k="s">▼</button><button data-k="d">►</button></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
'use strict';
const GLB_B64 = /*__GLB__*/'';
const $ = id => document.getElementById(id);
const TEST = new URLSearchParams(location.search).has('test');
const DT = 1 / 60;

/* ---------- parámetros (luego irían a config) ---------- */
const P = {
  espera: 5,          // s quieto antes del idle de magia
  entrada: 1.1,       // s en levantar la mano
  salida: 0.35,       // s en bajarla al moverse
  formar: 1.0,        // s en que las partículas forman la bola
  velAndar: 1.5,      // m/s
};

/* ---------- escena: exterior luminoso de día ---------- */
const cv = $('cv');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: 'high-performance' });
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 200);
camera.position.set(1.6, 1.7, 3.0);
const controls = new THREE.OrbitControls(camera, cv);
controls.enableDamping = true; controls.dampingFactor = 0.12; controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 0.8; controls.maxDistance = 12; controls.target.set(0, 1.2, 0);

(function sky() {
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#5f9fe0'); gr.addColorStop(0.55, '#a9cff0'); gr.addColorStop(1, '#f3e6cf');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; scene.background = t;
  scene.fog = new THREE.Fog(0xd9e6ef, 18, 70);
})();
scene.add(new THREE.HemisphereLight(0xcfe4ff, 0x6b7a45, 0.9));
const sun = new THREE.DirectionalLight(0xfff1d8, 2.6);
sun.position.set(4, 7, 3); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 1, far: 20 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);

(function ground() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'); g.fillStyle = '#6f8f45'; g.fillRect(0, 0, 256, 256);
  let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 5000; i++) { const v = 90 + rnd() * 70 | 0; g.fillStyle = `rgba(${v * 0.75 | 0},${v},${v * 0.45 | 0},0.35)`; g.fillRect(rnd() * 256, rnd() * 256, 1 + rnd() * 2, 1 + rnd() * 3); }
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(30, 30);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const m = new THREE.Mesh(new THREE.CircleGeometry(60, 64), new THREE.MeshStandardMaterial({ map: t, roughness: 0.95 }));
  m.rotation.x = -Math.PI / 2; m.receiveShadow = true; scene.add(m);
})();

/* ---------- bola de magia ---------- */
const ORB_COL = new THREE.Color(0x8fd4ff), ORB_CORE = new THREE.Color(0xfff6dc);
function glowTex() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,255,255,.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c);
}
const GLOW = glowTex();
const orb = new THREE.Group(); scene.add(orb);
const orbMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { uT: { value: 0 }, uA: { value: 0 }, uCol: { value: ORB_COL }, uCore: { value: ORB_CORE } },
  vertexShader: `varying vec3 vN; varying vec3 vV; varying vec3 vP;
    void main(){ vP = position; vec4 mv = modelViewMatrix * vec4(position,1.); vN = normalize(normalMatrix*normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix*mv; }`,
  fragmentShader: `uniform float uT; uniform float uA; uniform vec3 uCol; uniform vec3 uCore; varying vec3 vN; varying vec3 vV; varying vec3 vP;
    float h(vec3 p){ return fract(sin(dot(p, vec3(12.9898,78.233,37.719)))*43758.5453); }
    float n3(vec3 p){ vec3 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
      return mix(mix(mix(h(i),h(i+vec3(1,0,0)),f.x),mix(h(i+vec3(0,1,0)),h(i+vec3(1,1,0)),f.x),f.y),
                 mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x),mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x),f.y),f.z); }
    void main(){ float fr = 1. - max(dot(vN, vV), 0.);
      vec3 q = normalize(vP)*3.0; float sw = n3(q + vec3(uT*1.3, -uT*0.9, uT*0.7)) * .6 + n3(q*2.1 - uT*1.7) * .4;
      float core = pow(1. - fr, 2.2);
      vec3 c = mix(uCol, uCore, core*0.8) * (0.35 + 0.75*sw) + uCol * pow(fr, 2.) * 1.4;
      gl_FragColor = vec4(c * uA, 1.); }`,
});
const orbCore = new THREE.Mesh(new THREE.SphereGeometry(0.045, 32, 20), orbMat);
const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: ORB_COL, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
halo.scale.setScalar(0.26);
const orbLight = new THREE.PointLight(0x9fd8ff, 0, 2.2, 2);
orb.add(orbCore, halo, orbLight);

// partículas: órbitas alrededor de la bola + hilo de la palma a la bola
const NP = 220, NH = 40;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array((NP + NH) * 3), pA = new Float32Array(NP + NH), pS = new Float32Array(NP + NH);
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('aA', new THREE.BufferAttribute(pA, 1));
pGeo.setAttribute('aS', new THREE.BufferAttribute(pS, 1));
const pMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { uMap: { value: GLOW }, uCol: { value: ORB_COL }, uScale: { value: 300 } },
  vertexShader: `attribute float aA; attribute float aS; varying float vA; uniform float uScale;
    void main(){ vA = aA; vec4 mv = modelViewMatrix*vec4(position,1.); gl_PointSize = aS * uScale / -mv.z; gl_Position = projectionMatrix*mv; }`,
  fragmentShader: `uniform sampler2D uMap; uniform vec3 uCol; varying float vA;
    void main(){ vec4 t = texture2D(uMap, gl_PointCoord); gl_FragColor = vec4(mix(uCol, vec3(1.), .35) * t.a * vA, 1.); }`,
});
const parts = new THREE.Points(pGeo, pMat); parts.frustumCulled = false; scene.add(parts);
// semillas deterministas por partícula
const seed = []; { let s = 12345; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < NP; i++) seed.push({ r: 0.07 + r() * 0.08, w: 1.2 + r() * 2.5, ph: r() * 6.283, tilt: r() * 3.1416, az: r() * 6.283, s: 0.01 + r() * 0.025, far: 0.35 + r() * 0.5 }); }

/* ---------- personaje ---------- */
const V = THREE.Vector3, Q = THREE.Quaternion;
const UP = new V(0, 1, 0);
let char = null, mixer = null, acts = {}, B = {}, ready = false;
const pivot = new THREE.Group(); scene.add(pivot);   // posición y rumbo del personaje
let headFwdLocal = new V(0, 0, 1), chestFwdLocal = new V(0, 0, 1);

function b64ToBuf(b) { const s = atob(b), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u.buffer; }
const tA = new V(), tB = new V(), tC = new V(), tD = new V(), tE = new V(), tF = new V(), tG = new V(), tq = new Q(), tq2 = new Q(), tq3 = new Q();
const wp = (o, out) => o.getWorldPosition(out);

// rota un hueso en espacio mundo con el cuaternión q (q * world), y actualiza su subárbol
function rotWorld(bone, q) {
  bone.getWorldQuaternion(tq2);
  tq2.premultiply(q);
  bone.parent.getWorldQuaternion(tq3);
  bone.quaternion.copy(tq3.invert().multiply(tq2));
  bone.updateMatrixWorld(true);
}
// alinea la dirección hueso→hijo con dir (mundo)
function aim(bone, child, dir, w = 1) {
  wp(bone, tA); wp(child, tB); tB.sub(tA).normalize();
  tq.setFromUnitVectors(tB, tC.copy(dir).normalize());
  if (w < 1) tq.slerp(tq3.identity(), 1 - w);
  rotWorld(bone, tq);
}

// Datos por mano: huesos, normal de la palma (en el espacio del hueso de la mano) y eje de flexión de cada falange.
const H = { l: null, r: null };
let bones = [], bind = [];
function palmNormal(h, out) { h.hand.getWorldQuaternion(tq3); return out.copy(h.palm).applyQuaternion(tq3); }

// Recoloca las articulaciones de los dedos donde la malla realmente se dobla (el esqueleto del soldado se re-enlazó desde
// otro personaje y sus nudillos quedan 1–2 cm fuera de sitio). Cada articulación pasa al centro del anillo de vértices
// que comparten peso entre las dos falanges; la malla en reposo no cambia (se recalculan los boneInverses).
const MANOS_INFO = [];
function arreglarManos(root, clips) {
  const FINGER = /^(thumb|index|middle|ring|pinky)_0([123])_([lr])$/;
  root.updateMatrixWorld(true);
  const meshes = []; root.traverse(o => { if (o.isSkinnedMesh) meshes.push(o); });
  const byName = {}; root.traverse(o => { if (o.isBone) byName[o.name] = o; });
  const ring = {};   // nombre de hueso → [suma, n]
  const G = ['getX', 'getY', 'getZ', 'getW'], v = new V(), m = new THREE.Matrix4(), acc = new V();
  for (const mesh of meshes) {
    const sk = mesh.skeleton, g = mesh.geometry, pos = g.attributes.position, si = g.attributes.skinIndex, sw = g.attributes.skinWeight;
    if (!si || !sw) continue;
    for (let i = 0; i < pos.count; i++) {
      const ws = {}; let any = false;
      for (let k = 0; k < 4; k++) { const w = sw[G[k]](i); if (w > 0.15) { ws[sk.bones[si[G[k]](i)].name] = w; any = true; } }
      if (!any) continue;
      // pares (padre, hijo) en la misma cadena con peso repartido
      for (const n in ws) {
        const mm = FINGER.exec(n); if (!mm) continue;
        const parentName = mm[2] === '1' ? 'hand_' + mm[3] : `${mm[1]}_0${+mm[2] - 1}_${mm[3]}`;
        if (!(parentName in ws)) continue;
        const wsum = ws[n] + ws[parentName]; if (Math.min(ws[n], ws[parentName]) / wsum < 0.25) continue;
        acc.set(0, 0, 0); let wt = 0;
        for (let k = 0; k < 4; k++) {
          const w = sw[G[k]](i); if (w <= 0) continue; const bi = si[G[k]](i);
          v.fromBufferAttribute(pos, i).applyMatrix4(mesh.bindMatrix).applyMatrix4(sk.boneInverses[bi]).applyMatrix4(sk.bones[bi].matrixWorld);
          acc.addScaledVector(v, w); wt += w;
        }
        acc.multiplyScalar(1 / wt);
        const r = ring[n] || (ring[n] = [new V(), 0]); r[0].add(acc); r[1]++;
      }
    }
  }
  // mueve cada hueso de dedo (de la raíz a la punta) y recalcula su boneInverse para que la malla en reposo no cambie
  const oldW = new Map();
  root.traverse(o => { if (o.isBone && FINGER.test(o.name)) oldW.set(o, o.matrixWorld.clone()); });
  const orden = []; root.traverse(o => { if (o.isBone && FINGER.test(o.name)) orden.push(o); });
  for (const bn of orden) {
    const r = ring[bn.name]; if (!r || r[1] < 3 || /_01_/.test(bn.name)) continue;   // nudillos y base del pulgar: el anillo de esta malla no es fiable
    const want = r[0].multiplyScalar(1 / r[1]);
    bn.parent.updateMatrixWorld(true);
    const before = bn.getWorldPosition(new V());
    // hijos: conserva su posición en mundo (se recolocan después con su propio anillo si lo tienen)
    const kids = bn.children.filter(c => c.isBone).map(c => [c, c.getWorldPosition(new V())]);
    bn.position.copy(bn.parent.worldToLocal(want.clone()));
    bn.updateMatrixWorld(true);
    for (const [c, wpos] of kids) { c.position.copy(bn.worldToLocal(wpos)); c.updateMatrixWorld(true); }
    MANOS_INFO.push([bn.name, +(before.distanceTo(want) * 100).toFixed(2)]);
  }
  root.updateMatrixWorld(true);
  for (const mesh of meshes) {
    const sk = mesh.skeleton;
    sk.bones.forEach((bn, i) => {
      const W0 = oldW.get(bn); if (!W0) return;
      // nuevo inverso = W_nuevo⁻¹ · W_viejo · inverso_viejo
      m.copy(bn.matrixWorld).invert().multiply(W0).multiply(sk.boneInverses[i]);
      sk.boneInverses[i].copy(m);
    });
  }
  // los clips no deben devolver los dedos a la posición vieja
  for (const c of clips) c.tracks = c.tracks.filter(t => !(t.name.endsWith('.position') && FINGER.test(t.name.split('.')[0])));
}

new THREE.GLTFLoader().parse(b64ToBuf(GLB_B64), '', gltf => {
  char = gltf.scene;
  char.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; } });
  pivot.add(char);
  const find = n => { let r = null; char.traverse(o => { if (!r && o.isBone && o.name === n) r = o; }); return r; };
  // orienta el modelo para que mire a +Z (Blender/MakeHuman exporta mirando a −Z): de talón a punta del pie
  char.updateMatrixWorld(true);
  { const f = find0(char, 'foot_l'), bl = find0(char, 'ball_l');
    if (f && bl) { const d = bl.getWorldPosition(new V()).sub(f.getWorldPosition(new V())); if (d.z < 0) char.rotation.y = Math.PI; char.updateMatrixWorld(true); } }
  let esSoldado = false; char.traverse(o => { if (o.isSkinnedMesh && o.name === 'armor') esSoldado = true; });
  if (esSoldado) { arreglarManos(char, gltf.animations); APUNTAR_PULGAR = true; }   // solo el soldado re-enlazado: el héroe MakeHuman ya trae los dedos bien
  char.traverse(o => { if (o.isBone) { bones.push(o); bind.push([o.quaternion.clone(), o.position.clone()]); } });
  ['spine_03', 'neck_01', 'head', 'pelvis'].forEach(n => B[n] = find(n));
  char.updateMatrixWorld(true);   // pose de enlace (bind): mano abierta
  for (const sd of ['l', 'r']) {
    const h = { side: sd, upper: find('upperarm_' + sd), lower: find('lowerarm_' + sd), hand: find('hand_' + sd),
      index: find('index_01_' + sd), middle: find('middle_01_' + sd), pinky: find('pinky_01_' + sd), fingers: [], palm: new V() };
    const inv = new THREE.Matrix4().copy(h.hand.matrixWorld).invert(), loc = b => wp(b, new V()).applyMatrix4(inv);
    const kI = loc(h.index), kM = loc(h.middle), kP = loc(h.pinky);
    h.palm.crossVectors(kM.clone().normalize(), kI.clone().sub(kP)).normalize();
    // la palma mira hacia donde se doblan los dedos en el clip de reposo (se comprueba más abajo)
    ['index', 'middle', 'ring', 'pinky', 'thumb'].forEach((f, fi) => {
      for (let j = 1; j <= 3; j++) {
        const b = find(`${f}_0${j}_${sd}`); if (!b) continue;
        h.fingers.push({ b, fi, j, thumb: f === 'thumb', bindQ: b.quaternion.clone(), axis: new V(), axisN: new V() });
      }
    });
    H[sd] = h;
  }
  mixer = new THREE.AnimationMixer(char);
  for (const c of gltf.animations) acts[c.name] = mixer.clipAction(c);
  acts.reposo.play(); acts.andar.play(); acts.andar.setEffectiveWeight(0);
  mixer.update(0.5); char.updateMatrixWorld(true);
  for (const sd of ['l', 'r']) {
    const h = H[sd];
    // signo de la palma: el pulgar del clip de reposo se cierra hacia ella
    const inv = new THREE.Matrix4().copy(h.hand.matrixWorld).invert();
    const th = wp(h.fingers.find(f => f.thumb && f.j === 3).b, new V()).applyMatrix4(inv);
    const kM = wp(h.middle, new V()).applyMatrix4(inv);
    if (th.sub(kM.multiplyScalar(0.6)).dot(h.palm) < 0) h.palm.negate();
  }
  // ejes de flexión en la pose de enlace: girar la falange hacia la palma
  resetBind(); char.updateMatrixWorld(true);
  for (const sd of ['l', 'r']) {
    const h = H[sd]; palmNormal(h, tF);
    for (const f of h.fingers) {
      const child = f.b.children.find(c => c.isBone);
      wp(f.b, tA); if (child) wp(child, tB).sub(tA); else { f.b.getWorldQuaternion(tq); tB.set(0, 1, 0).applyQuaternion(tq); }
      tB.normalize();
      tC.crossVectors(tB, tF);
      if (tC.lengthSq() < 1e-6) tC.set(1, 0, 0);
      f.b.getWorldQuaternion(tq); tq.invert(); f.axis.copy(tC.normalize()).applyQuaternion(tq);
      f.axisN.copy(tF).applyQuaternion(tq);   // eje de separación (abducción): la normal de la palma
    }
  }
  const fwd = new V(0, 0, 1);
  mixer.update(0); char.updateMatrixWorld(true);
  B.head.getWorldQuaternion(tq); headFwdLocal.copy(fwd).applyQuaternion(tq.invert());
  ready = true;
}, e => { $('estado').textContent = 'Error al cargar: ' + e.message; console.error(e); });
function find0(root, n) { let r = null; root.traverse(o => { if (!r && o.isBone && o.name === n) r = o; }); return r; }
function resetBind() { for (let i = 0; i < bones.length; i++) { bones[i].quaternion.copy(bind[i][0]); bones[i].position.copy(bind[i][1]); } }

/* ---------- input ---------- */
const keys = new Set();
addEventListener('keydown', e => { const k = e.key.toLowerCase(); if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) { keys.add(k); e.preventDefault(); } });
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());
document.querySelectorAll('#pad button').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { keys.add(k); e.preventDefault(); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => keys.delete(k)));
});
let pasear = false, pausa = false, vel = 1;
$('bPasear').onclick = () => { pasear = !pasear; $('bPasear').classList.toggle('on', pasear); };

  }
  // suavizado: la bola sigue su recorrido con un muelle rápido (quita esquinas) y la mirada con uno lento (retraso natural)
  const dt = lastT < 0 || t < lastT || t - lastT > 1 ? -1 : t - lastT; lastT = t;
  if (!springInit || dt < 0 || S.forma <= 0) { orbS.copy(out); orbV.set(0, 0, 0); lookP.copy(out); lookV.set(0, 0, 0); springInit = true; }
  else { spring(orbS, orbV, out, 22, dt); spring(lookP, lookV, orbS, 7, dt); }
  out.copy(orbS);
  orb.position.copy(out);
}

// estela: últimas posiciones de la bola
const TRAIL = Array.from({ length: NH }, () => new V()); let trailI = 0, trailInit = false;
function updateOrb(t, forma, w) {
  const f = ease(forma);
  orbP.copy(orb.position);
  palmFrame(H.l, PF.l); palm.copy(PF.l.c); pn.copy(PF.l.n);
  const sc = 0.2 + 0.8 * f, pulse = 1 + 0.05 * Math.sin(t * 5.0);
  orbCore.scale.setScalar(sc * pulse); halo.scale.setScalar(0.26 * sc * pulse);
  orbMat.uniforms.uT.value = t; orbMat.uniforms.uA.value = f;
  halo.material.opacity = 0.5 * f; orbLight.intensity = 1.2 * f;
  orb.visible = f > 0.001;
  const gather = 1 - f;
  for (let i = 0; i < NP; i++) {
    const p = seed[i], ang = p.ph + t * p.w, r = p.r * (1 + gather * p.far * 6);
    tB.set(Math.cos(ang) * r, Math.sin(ang * 0.5 + p.tilt) * r * 0.45, Math.sin(ang) * r).applyAxisAngle(UP, p.az);
    pPos[i * 3] = orbP.x + tB.x; pPos[i * 3 + 1] = orbP.y + tB.y; pPos[i * 3 + 2] = orbP.z + tB.z;
    const tw = 0.5 + 0.5 * Math.sin(t * 6 + p.ph * 3);
    pA[i] = (forma > 0 && w > 0 ? Math.min(1, forma * 3) : 0) * (0.25 + 0.5 * tw);
    pS[i] = p.s;
  }
  if (!trailInit || f <= 0) { for (const q of TRAIL) q.copy(orbP); trailInit = true; }
  TRAIL[trailI].copy(orbP); trailI = (trailI + 1) % NH;
  for (let k = 0; k < NH; k++) {
    const i = NP + k, age = ((trailI - 1 - k) + NH) % NH, q = TRAIL[age], fade = 1 - k / NH;
    pPos[i * 3] = q.x; pPos[i * 3 + 1] = q.y; pPos[i * 3 + 2] = q.z;
    pA[i] = f * fade * fade * 0.7; pS[i] = 0.02 * fade + 0.006;
  }
  pGeo.attributes.position.needsUpdate = true; pGeo.attributes.aA.needsUpdate = true; pGeo.attributes.aS.needsUpdate = true;
}

// Render interpolado entre el estado anterior y el actual (alpha = fracción del paso pendiente): sin tirones a 120/144 Hz.
const prev = { ...S };
const lerpA = (a, b, k) => { let d = b - a; d = Math.atan2(Math.sin(d), Math.cos(d)); return a + d * k; };
function pose(alpha) {
  if (!ready) return;
  const L = (k) => prev[k] + (S[k] - prev[k]) * alpha;
  const x = L('x'), z = L('z'), mov = L('mov'), w = L('w'), forma = L('forma'), t = L('t');
  const idleT = S.w > 0 ? Math.max(0, S.idleT - (1 - alpha) * DT) : 0;
  pivot.position.set(x, 0, z); pivot.rotation.y = lerpA(prev.rumbo, S.rumbo, alpha);
  resetBind();
  acts.andar.setEffectiveWeight(mov); acts.reposo.setEffectiveWeight(1 - mov);
  acts.reposo.time = (t * vel0) % acts.reposo.getClip().duration;
  acts.andar.time = (S.walkT + (alpha - 1) * DT) % acts.andar.getClip().duration;
  mixer.update(0);
  pivot.updateMatrixWorld(true);
  applyPose(w, idleT, mov);
  updateOrb(idleT, forma, w);
  return [x, z];
}
const vel0 = 1;

/* ---------- bucle: paso fijo + render ---------- */
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); pMat.uniforms.uScale.value = h * 0.9; }
addEventListener('resize', resize); resize();
function frame(alpha) {
  const xz = pose(alpha) || [S.x, S.z];
  // la cámara sigue al personaje
  tA.set(xz[0], 1.2, xz[1]); tB.subVectors(tA, controls.target); controls.target.add(tB); camera.position.add(tB);
  sun.position.set(xz[0] + 4, 7, xz[1] + 3); sun.target.position.set(xz[0], 0, xz[1]);
  controls.update();
  renderer.render(scene, camera);
  ui();
}
function ui() {
  if (!ready) return;
  $('estado').textContent = S.fase[0].toUpperCase() + S.fase.slice(1);
  $('reloj').textContent = `quieto ${Math.min(S.quieto, 99).toFixed(1)} s`;
  $('meter').firstElementChild.style.width = (Math.min(1, S.quieto / P.espera) * 100).toFixed(1) + '%';
}
function tick() { Object.assign(prev, S); step(); }
let acc = 0, last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.1, (now - last) / 1000) * vel; last = now;
  if (!ready) return;
  if (!pausa) { acc += dt; let n = 0; while (acc >= DT && n < 8) { tick(); acc -= DT; n++; } if (n === 8) acc = 0; }
  frame(acc / DT);
}
if (!TEST) requestAnimationFrame(loop);

window.__IDLE__ = {
  ready: () => ready,
  state: () => ({ ...S, coreo: { ...C }, espera: P.espera, orbVisible: orb.visible, orb: orb.position.toArray(), palm: palm.toArray(),
    hand: ready ? wp(H.l.hand, new V()).toArray() : null, chest: ready ? wp(B.spine_03, new V()).toArray() : null }),
  step: (n = 1) => { for (let i = 0; i < n; i++) tick(); frame(1); return window.__IDLE__.state(); },
  key: (k, on) => { on ? keys.add(k) : keys.delete(k); },
  forzar: () => $('bForzar').click(),
  camara: (x, y, z, tx, ty, tz) => { camera.position.set(x, y, z); controls.target.set(tx, ty, tz); controls.update(); renderer.render(scene, camera); },
  render: () => renderer.render(scene, camera),
  camaraCabeza: (dx, dy, dz) => { const c = wp(B.head, new V()); camera.position.set(c.x + dx, c.y + dy, c.z + dz); camera.lookAt(c); renderer.render(scene, camera); },
  // cámara relativa a una mano (lado 'l' o 'r'); sinBola oculta la bola y sus partículas para ver la mano
  camaraMano: (lado, dx, dy, dz, sinBola) => { const h = wp(H[lado].hand, new V()), m = wp(H[lado].middle, new V()), c = h.lerp(m, 0.5);
    camera.position.set(c.x + dx, c.y + dy, c.z + dz); controls.target.copy(c); camera.lookAt(c);
    const vis = [orb.visible, parts.visible]; if (sinBola) { orb.visible = false; parts.visible = false; }
    renderer.render(scene, camera); orb.visible = vis[0]; parts.visible = vis[1]; },
  _clips: () => Object.values(acts).map(a => a.getClip()),
  manos: () => MANOS_INFO,
  _dbg: () => ({ THREE, scene, camera, renderer, char, H, pivot, resetBind }),
  // posiciones de los huesos de la mano izq. en el espacio local de hand_l (depuración)
  mano: () => { const inv = new THREE.Matrix4().copy(H.l.hand.matrixWorld).invert(), r = {};
    char.traverse(o => { if (o.isBone && /_l$/.test(o.name) && /(index|middle|ring|pinky|thumb)/.test(o.name)) r[o.name] = wp(o, new V()).applyMatrix4(inv).toArray().map(v => +v.toFixed(3)); });
    return r; },
};
</script>
